      <${Field} label="Authentication" hint="@ai-sdk/anthropic sends the key as x-api-key; some gateways want a Bearer token instead.">
        <select value=${bearer ? 'bearer' : 'x'} onChange=${e => setBearer(e.target.value === 'bearer')}>
          <option value="x">x-api-key (options.apiKey)</option>
          <option value="bearer">Also send Authorization: Bearer (options.headers)</option>
        </select><//>
      ${mode === 'split' && html`
        <${Field} label="New provider ID"><input type="text" class="mono" value=${newId} onInput=${e => setNewId(e.target.value)} /><//>
        <${Field} label="New provider name"><input type="text" value=${name} onInput=${e => setName(e.target.value)} /><//>`}
    </div>
    <div style="margin-top:10px"><${AnthropicTests} pid=${pid} baseURL=${baseURL.trim()} bearer=${bearer}
      claudeIds=${rep.claude.map(id => apiModelId(pid, id))} otherIds=${others.map(id => apiModelId(pid, id))}
      onOtherResult=${r => setOtherWorks(!!r.ok)} /></div>
    ${otherWorks && mode === 'split' && html`<p class="note" style="color:var(--ok)">The non-Anthropic model works through this endpoint too, so you can
      switch the whole provider instead of splitting it. <button class="small" onClick=${() => setMode('switch')}>Switch whole provider</button></p>`}
    ${mode === 'split' && idTaken && html`<div class="err">A provider with this ID already exists.</div>`}
    ${mode === 'split' ? html`
      <div class="field" style="margin-top:10px"><span>Models to move (API key, headers and model config are copied)</span>
        <div class="mlist" style="max-height:200px;overflow:auto">
          ${listIds.map(id => html`<label class="mrow check" style="display:flex">
            <input type="checkbox" checked=${models.includes(id)} onChange=${e => setModels(e.target.checked ? [...models, id] : models.filter(x => x !== id))} />
            <span class="mono">${id}</span>${isClaude(id, modelObj(pid, id, false)) && html`<span class="badge">claude</span>`}</label>`)}
          ${!listIds.length && html`<div class="empty">No enabled models.</div>`}
        </div></div>
      <div class="row" style="margin-top:8px"><span class="note">On <span class="mono">${pid}</span>:</span>
        <label class="check"><input type="radio" name="orig" checked=${original === 'remove'} onChange=${() => setOriginal('remove')} />remove them</label>
        <label class="check"><input type="radio" name="orig" checked=${original === 'disable'} onChange=${() => setOriginal('disable')} />keep them disabled</label>
      </div>
      <p class="note">References such as <span class="mono">model</span> are updated to <span class="mono">${newId || '…'}/model</span>.</p>`
    : others.length > 0 && !otherWorks && html`<p class="note" style="color:var(--warn)">${others.length} enabled non-Claude model(s) on this provider
        (${others.slice(0, 5).join(', ')}${others.length > 5 ? ', …' : ''}) will also be sent to the Anthropic API and will probably stop working.
        Moving only the Claude models is safer, unless the non-Anthropic test above succeeds.</p>`}
    <div class="actions"><button onClick=${close}>Cancel</button>
      <button class="primary" disabled=${!ok} onClick=${() => {
        applyAnthropicCompat(pid, { mode, newId: newId.trim(), name: name.trim(), baseURL: baseURL.trim(), bearer, models, original });
        close();
      }}>${mode === 'split' ? `Move ${models.length} model(s)` : 'Switch provider'}</button></div><//>`;
}

// ---------------------------------------------------------------- general settings

function GeneralEditor() {
  const set = (k, v) => mutate(() => { if (v === undefined) delete S.config[k]; else S.config[k] = v; }, 'g:' + k);
  const choices = [];
  for (const pid of Object.keys(providers())) for (const id of modelState(pid).enabled) choices.push(`${pid}/${id}`);
  const handled = new Set(['$schema', 'provider', 'providers', 'model', 'small_model', 'disabled_providers', 'enabled_providers']);
  const others = Object.keys(S.config).filter(k => !handled.has(k));
  return html`<div>
    <div class="pe-head"><h2>General</h2></div>
    <section class="card"><h3>Default models</h3>
      <datalist id="model-choices">${choices.map(c => html`<option value=${c} />`)}</datalist>
      <div class="grid2">
        <${Field} label="model" hint="Default model, format provider/model">
          <${TextField} mono list="model-choices" value=${S.config.model} onChange=${v => set('model', v)} placeholder="provider/model" /><//>
        <${Field} label="small_model" hint="Used for lightweight tasks like title generation">
          <${TextField} mono list="model-choices" value=${S.config.small_model} onChange=${v => set('small_model', v)} placeholder="provider/model" /><//>
      </div></section>
    <section class="card"><h3>OpenCode version</h3>
      <div class="row">
        <select style="width:auto" value=${targetVersion()} onChange=${e => setTarget(e.target.value)}>
          <option value="v1">OpenCode 1.x</option><option value="v2">OpenCode 2.x</option></select>
        <span class="note">${LOCAL?.target && S.settings.target === LOCAL.target ? 'Detected from the installed OpenCode.' : S.settings.target ? (LOCAL ? 'Chosen by you.' : 'Chosen by you (stored in this browser).') : 'Inferred from the file.'}
          Decides the format of new providers and which workarounds are offered.</span>
      </div>
      ${targetVersion() === 'v2' && Object.keys(v1Map()).length > 0 && html`<p class="note">${Object.keys(v1Map()).length} provider(s) use the V1
        <span class="mono">provider</span> format. OpenCode 2 still reads them, but ignores <span class="mono">whitelist</span>/<span class="mono">blacklist</span>
        and only offers <span class="mono">compatibility</span> options (such as cacheFormat) for native <span class="mono">providers</span> entries.
        <button class="small" onClick=${() => convertAll('v2')}>Convert all to V2</button></p>`}
      ${targetVersion() === 'v1' && Object.keys(v2Map()).length > 0 && html`<p class="note" style="color:var(--warn)">${Object.keys(v2Map()).length} provider(s)
        use the OpenCode 2 <span class="mono">providers</span> format, which OpenCode 1.x does not read.
        <button class="small primary" onClick=${() => convertAll('v1')}>Convert all to V1</button></p>`}
    </section>
    ${(() => {
      const off = (S.config.disabled_providers || []).includes(ZEN_ID);
      const blocked = providerBlocked(ZEN_ID);
      const refs = modelRefs().filter(([, v]) => typeof v === 'string' && v.startsWith(ZEN_ID + '/'));
      return html`<section class="card"><h3>Built-in OpenCode provider (OpenCode Zen)</h3>
        <label class="check"><input type="checkbox" checked=${off} onChange=${e => toggleProviderDisabled(ZEN_ID, e.target.checked)} />
          Disable the built-in <span class="mono">${ZEN_ID}</span> provider</label>
        <p class="note" style="margin:6px 0 0">Adds <span class="mono">"${ZEN_ID}"</span> to <span class="mono">disabled_providers</span>, which removes the Zen models
          (including the free ones, whose prompts may be used to improve the models) from the model picker. Works on OpenCode 1.x and 2.x.
          ${!off && blocked && html` It is already excluded because it's ${blocked}.`}</p>
        ${refs.length > 0 && html`<p class="note" style="color:var(--warn);margin:6px 0 0">${off ? 'These still point at Zen models and will fail:' : 'Currently using Zen models:'}
          ${refs.map(([k, v]) => html`<span class="badge" style="margin:2px">${k} = ${v}</span>`)}</p>`}
      </section>`;
    })()}
    <section class="card"><h3>Provider allow / deny lists</h3>
      <div class="grid2">
        <${Field} label="disabled_providers" hint="Comma separated provider ids that should not load">
          <${CommitInput} mono value=${(S.config.disabled_providers || []).join(', ')}
            onCommit=${v => { const a = v.split(',').map(s => s.trim()).filter(Boolean); set('disabled_providers', a.length ? a : undefined); }} /><//>
        <${Field} label="enabled_providers" hint="If set, only these providers load">
          <${CommitInput} mono value=${(S.config.enabled_providers || []).join(', ')}
            onCommit=${v => { const a = v.split(',').map(s => s.trim()).filter(Boolean); set('enabled_providers', a.length ? a : undefined); }} /><//>
      </div></section>
    <section class="card"><h3>Editor settings</h3>
      <${Field} label="CORS proxy for /models requests (stored in this browser only)"
        hint=${html`Prefix added before the URL, e.g. <span class="mono">https://my-proxy.example/</span>, or a template containing <span class="mono">{url}</span> (URL-encoded). Leave empty to call endpoints directly. Requests include your API key — only use a proxy you trust.`}>
        <${TextField} mono value=${S.settings.corsProxy} onChange=${v => { S.settings.corsProxy = v || ''; persist(); bump(); }} /><//>
    </section>
    <section class="card"><h3>Other settings</h3>
      <p class="note">${others.length
        ? html`These top-level keys aren't edited by this tool's forms and are preserved as-is: ${others.map(k => html`<span class="badge" style="margin:2px">${k}</span>`)}`
        : 'No other top-level keys.'}</p>
      <details><summary class="note" style="cursor:pointer">Edit the full config as JSON</summary>
        <div style="margin-top:8px"><${JsonEditor} rows=${20} value=${S.config} requireObject
          onApply=${v => mutate(() => { S.config = v; })} /></div></details>
    </section>
  </div>`;
}

// ---------------------------------------------------------------- provider editor

function ProviderEditor({ pid }) {
  const p = prov(pid);
  if (!isObj(p)) return html`<div class="empty">Provider "${pid}" is not an object in the config.</div>`;
  const set = (path, v) => mutate(() => setIn(prov(pid), path, v), `p:${pid}:${path.join('.')}`);
  const disabled = (S.config.disabled_providers || []).includes(pid);
  const fmt = fmtOf(pid), paths = P(pid), v2 = fmt === 'v2';
  return html`<div>
    <div class="pe-head">
      <h2>${p.name || pid}</h2><span class="muted mono">${pid}</span>
      <span class="badge" title=${v2 ? 'Native OpenCode 2 entry under "providers"' : 'Legacy V1 entry under "provider" (OpenCode 2 still reads it)'}>${v2 ? 'V2 · providers' : 'V1 · provider'}</span>
      <span class="grow" />
      ${!v2 && targetVersion() === 'v2' && html`<button onClick=${() => convertProviderToV2(pid)} title="Move this entry to the native OpenCode 2 format">Convert to V2</button>`}
      ${v2 && targetVersion() === 'v1' && html`<button class="primary" onClick=${() => convertProviderToV1(pid)} title="OpenCode 1.x doesn't read &quot;providers&quot;">Convert to V1</button>`}
      <label class="check"><input type="checkbox" checked=${!disabled} onChange=${e => toggleProviderDisabled(pid, !e.target.checked)} />
        Provider enabled</label>
      <button class="danger" onClick=${() => deleteProvider(pid)}>Delete provider</button>
    </div>
    <section class="card"><h3>Connection</h3>
      <datalist id="pkg-list">${(v2 ? V2_PACKAGES() : NPM_PACKAGES).map(n => html`<option value=${n} />`)}</datalist>
      <div class="grid2">
        <${Field} label="Provider ID" hint="Key under provider; model refs use id/model. Press Enter to rename.">
          <${CommitInput} mono value=${pid} onCommit=${v => renameProvider(pid, v)} /><//>
        <${Field} label="Display name (name)"><${TextField} value=${p.name} onChange=${v => set(['name'], v)} /><//>
        <${Field} label=${v2 ? 'package' : 'npm'} hint=${v2
          ? html`Native: <span class="mono">${NATIVE_OAI}</span>; AI SDK packages use the <span class="mono">aisdk:</span> prefix. Empty for built-in providers.`
          : 'AI SDK package. Leave empty for built-in providers.'}>
          <${TextField} mono list="pkg-list" value=${getIn(p, paths.pkg)} onChange=${v => set(paths.pkg, v)}
            placeholder=${v2 ? NATIVE_OAI : '@ai-sdk/openai-compatible'} /><//>
        <${Field} label=${`Base URL (${paths.baseURL.join('.')})`}>
          <${TextField} mono value=${getIn(p, paths.baseURL)} onChange=${v => set(paths.baseURL, v)} placeholder=${KNOWN_BASE[pid] || 'https://api.example.com/v1'} /><//>
        <${Field} label=${`API key (${paths.apiKey.join('.')})`} hint=${html`Prefer <span class="mono">{env:VAR_NAME}</span> or <span class="mono">{file:~/path}</span> over a literal key.`}>
          <${SecretField} value=${getIn(p, paths.apiKey)} onChange=${v => set(paths.apiKey, v)} placeholder="{env:API_KEY}" /><//>
      </div>
      <div class="grid2" style="margin-top:12px">
        <${Field} label=${`Headers (${paths.headers.join('.')}) — JSON object`}>
          <${JsonEditor} rows=${3} value=${getIn(p, paths.headers)} requireObject onApply=${v => set(paths.headers, v)} /><//>
        ${v2 && html`<${Field} label="Extra request body fields (body) — JSON object">
          <${JsonEditor} rows=${3} value=${p.body} requireObject onApply=${v => set(['body'], v)} /><//>`}
      </div>
    </section>
    <${CacheCard} pid=${pid} />
    ${isCustom(p) && /@ai-sdk\/anthropic$/.test(pkgOf(p)) && (() => {
      const st = modelState(pid);
      const enabled = st.known.filter(id => st.enabled.has(id));
      const claudeIds = enabled.filter(id => isClaude(id, modelObj(pid, id, false))).map(id => apiModelId(pid, id));
      const otherIds = enabled.filter(id => !isClaude(id, modelObj(pid, id, false))).map(id => apiModelId(pid, id));
      return html`<section class="card"><h3>Anthropic API test</h3>
        <${AnthropicTests} pid=${pid} baseURL=${getIn(p, P(pid).baseURL) || ''} bearer=${false} claudeIds=${claudeIds} otherIds=${otherIds} /></section>`;
    })()}
    ${v2 && html`<details class="card"><summary>Compatibility <span class="muted" style="font-weight:normal">— applies to all models; models can override per field</span></summary>
      <${CompatEditor} value=${p.compatibility} onSet=${(k, v) => set(['compatibility', k], v)} /></details>`}
    <${ModelsCard} key=${pid} pid=${pid} />
    <details class="card"><summary>Raw provider JSON <span class="muted" style="font-weight:normal">— every field, including ones without a form</span></summary>
      <${JsonEditor} rows=${16} value=${p} requireObject onApply=${v => setProviderEntry(pid, v)} /></details>
  </div>`;
}

// V2 "compatibility" keys, per https://opencode.ai/v2/docs/models/
function CompatEditor({ value, onSet, modelLevel }) {
  const c = isObj(value) ? value : {};
  const sel = (k, opts) => html`<select value=${c[k] ?? ''} onChange=${e => onSet(k, e.target.value || undefined)}>
    <option value="">— unset (auto) —</option>${opts.map(o => html`<option value=${o}>${o}</option>`)}</select>`;
  const tri = k => html`<${TriBool} value=${c[k]} onChange=${v => onSet(k, v)} />`;
  return html`<div>
    <datalist id="reasoning-fields"><option value="reasoning" /><option value="reasoning_content" /><option value="reasoning_text" /></datalist>
    <div class="grid3">
      <${Field} label="cacheFormat" hint="Adds cache_control markers. Leave unset if the gateway rejects them.">${sel('cacheFormat', ['anthropic', 'alibaba'])}<//>
      <${Field} label="supportsPromptCacheKey" hint="Send prompt_cache_key">${tri('supportsPromptCacheKey')}<//>
      <${Field} label="maxTokensField">${sel('maxTokensField', ['max_completion_tokens', 'max_tokens'])}<//>
      <${Field} label="reasoningField" hint="Stream field carrying reasoning">
        <${TextField} mono list="reasoning-fields" value=${c.reasoningField} onChange=${v => onSet('reasoningField', v)} /><//>
      <${Field} label="requireReasoning">${tri('requireReasoning')}<//>
      <${Field} label="requireFinishReason">${tri('requireFinishReason')}<//>
      <${Field} label="requireAssistantAfterTool">${tri('requireAssistantAfterTool')}<//>
      <${Field} label="streamUsage">${tri('streamUsage')}<//>
      <${Field} label="mediaInput">${sel('mediaInput', ['assets', 'state', 'root'])}<//>
      ${modelLevel && html`
        <${Field} label="supportsThinkingBlockBinding">${tri('supportsThinkingBlockBinding')}<//>
        <${Field} label="supportsEffortUpdates">${tri('supportsEffortUpdates')}<//>`}
    </div>
  </div>`;
}

function CacheCard({ pid }) {
  const p = prov(pid);
  const v2 = fmtOf(pid) === 'v2';
  const rep = cacheReport(pid);
  const markers = !!(rep.providerFormat || rep.modelFormats.length || rep.explicit.length);
  // The cache_control problem is specific to Anthropic models: hide the panel when the provider has none.
  if (!rep.claude.length) return null;
  const pathStr = path => path.join('.');
  return html`<section class="card">
    <h3>Prompt caching (cache_control)</h3>
    <p class="note" style="margin-top:-6px">Some OpenAI-compatible gateways reject Anthropic-style markers with errors like
      <span class="mono">messages[0] field "cache_control" cannot be represented by the selected adapter</span>.
      ${v2 ? html`OpenCode 2 only sends these markers when <span class="mono">compatibility.cacheFormat</span> is set (on the provider or a model)
      or when they are configured explicitly.` : ''}</p>
    ${!v2 && targetVersion() === 'v1' ? html`
      <p class="note">OpenCode <b>1.x</b> attaches cache_control to every model whose id contains "claude" or "anthropic",
        and has no setting to turn it off (<a href="https://github.com/anomalyco/opencode/issues/6473" target="_blank" rel="noopener" style="color:var(--accent)">#6473</a>).
        ${rep.enabledClaude.length
          ? html`Affected here: ${rep.enabledClaude.map(id => html`<span class="badge" style="margin:2px">${id}</span>`)}`
          : 'No enabled model on this provider matches right now.'}</p>
      <p class="note">If the gateway rejects the markers, either:</p>
      <ul class="note" style="margin:0 0 10px;padding-left:20px">
        <li><b>Use the gateway's Anthropic-compatible API</b>, if it has one (<span class="mono">POST …/v1/messages</span>): Claude models go through
          <span class="mono">@ai-sdk/anthropic</span>, which sends cache_control in the format Anthropic expects, so prompt caching keeps working.</li>
        <li><b>Strip them with a plugin</b>: a small local plugin removes cache_control from every request to this provider. No gateway changes needed.</li>
        <li><b>Use gateway aliases</b>: give the models ids without "claude"/"anthropic" (e.g. LiteLLM <span class="mono">model_name</span>), then rename them here.</li>
      </ul>
      <div class="row">
        <button class="primary" onClick=${() => setUI({ modal: { type: 'anthropic', pid } })}>Test & use Anthropic-compatible API…</button>
        <button onClick=${() => setUI({ modal: { type: 'plugin', pid } })}>Generate strip plugin…</button>
        <button disabled=${!rep.claude.length} onClick=${() => setUI({ modal: { type: 'alias', pid } })}>Rename to gateway aliases…</button>
        ${rep.explicit.length > 0 && html`<button onClick=${() => stripCacheControl(pid)}>Remove ${rep.explicit.length} explicit cache_control option(s)</button>`}
      </div>`
    : !v2 ? html`
      <p class="note">This is a <b>V1</b> entry. OpenCode 2 migrates it in memory, and V1 OpenCode attaches cache_control to every
        model whose id contains "claude" or "anthropic" on OpenAI-compatible providers, with no option to turn it off.
        Converting to the native V2 format gives you explicit control through <span class="mono">compatibility.cacheFormat</span>.</p>
      <div class="row">
        <button class="primary" onClick=${() => convertProviderToV2(pid)}>Convert to V2</button>
        ${rep.explicit.length > 0 && html`<button onClick=${() => stripCacheControl(pid)}>Remove ${rep.explicit.length} explicit cache_control option(s)</button>`}
      </div>`
    : html`
      <div class="grid2">
        <${Field} label="Provider compatibility.cacheFormat">
          <select value=${rep.providerFormat ?? ''} onChange=${e => mutate(() => setIn(prov(pid), ['compatibility', 'cacheFormat'], e.target.value || undefined))}>
            <option value="">— unset (no markers on custom gateways) —</option><option value="anthropic">anthropic</option><option value="alibaba">alibaba</option>
          </select><//>
        <div class="field"><span>Current state</span><div class="note">
          ${markers
            ? html`<span class="err">cache_control will be sent</span>${rep.providerFormat ? ` for all models (provider cacheFormat: ${rep.providerFormat})` : ''}`
            : html`<span style="color:var(--ok)">No cache_control markers configured</span>`}
          ${rep.modelFormats.length > 0 && html`<div>Models with cacheFormat: ${rep.modelFormats.map(([id, f]) => html`<span class="badge" style="margin:2px">${id}: ${f}</span>`)}</div>`}
          ${rep.explicit.length > 0 && html`<div>Explicit markers: ${rep.explicit.map(x => html`<span class="badge" style="margin:2px">${pathStr(x)}</span>`)}</div>`}
        </div></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class=${markers ? 'primary' : ''} disabled=${!markers} onClick=${() => stripCacheControl(pid)}
          title="Unset every compatibility.cacheFormat and delete explicit cache_control / cacheControl keys in this provider">
          Gateway rejects cache_control → remove all cache markers</button>
        <button disabled=${!rep.enabledClaude.length} onClick=${() => setClaudeCacheFormat(pid, 'anthropic')}
          title="Set compatibility.cacheFormat: anthropic on each enabled Claude model">
          Gateway supports it → enable caching on ${rep.enabledClaude.length} Claude model(s)</button>
      </div>
      ${/^aisdk:/.test(pkgOf(p)) && html`<p class="note">This provider uses an AI SDK package (<span class="mono">${pkgOf(p)}</span>).
        If markers are still sent with cacheFormat unset, switch to the native package:
        <button class="small" onClick=${() => mutate(() => { prov(pid).package = NATIVE_OAI; })}>Use ${NATIVE_OAI}</button></p>`}`}
  </section>`;
}

function FetchBox({ pid, opts, setOpts }) {
  const m = meta(pid);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [, force] = useState(0);
  const setMeta = (k, v) => mutate(() => { if (v === undefined) delete meta(pid)[k]; else meta(pid)[k] = v; }, `meta:${pid}:${k}`);
  const run = async () => {
    setBusy(true); setErr(null);
    try {
      const items = await fetchModels(pid);
      const n = mergeFetched(pid, items, opts);
      toast(`Fetched ${items.length} models, ${n} new`);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const literalKey = fetchKey(pid) && !sessionKeys[pid];
  return html`<div class="fetchbox">
    <div class="grid2">
      <${Field} label="Models endpoint">
        <${TextField} mono value=${m.fetchUrl} placeholder=${defaultFetchUrl(pid) || 'https://api.example.com/v1/models'} onChange=${v => setMeta('fetchUrl', v)} /><//>
      <${Field} label="Auth style">
        <select value=${m.auth || defaultAuth(pid)} onChange=${e => setMeta('auth', e.target.value)}>
          <option value="bearer">Authorization: Bearer (OpenAI-style)</option>
          <option value="anthropic">x-api-key (Anthropic)</option>
          <option value="google">?key= query (Google)</option>
          <option value="none">No auth</option>
        </select><//>
      <${Field} label="API key for fetching (memory only, never saved)"
        hint=${literalKey ? 'Using the literal key from options.apiKey unless you enter one.' : 'The config key is an {env:}/{file:} reference or empty, so enter it here.'}>
        <input type="password" class="mono" value=${sessionKeys[pid] || ''} autocomplete="off"
          onInput=${e => { sessionKeys[pid] = e.target.value; force(x => x + 1); }} /><//>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" disabled=${busy} onClick=${run}>${busy ? 'Fetching…' : 'Fetch models'}</button>
      <button disabled=${busy} onClick=${() => setUI({ modal: { type: 'paste', pid, opts } })}
        title="Get a curl command for the request and paste its output (avoids CORS)">curl / paste response…</button>
      <button class="small" onClick=${() => copyCurl(pid)} title="Copy an equivalent curl command (key referenced as an env var)">Copy curl</button>
      <label class="check"><input type="checkbox" checked=${opts.enableNew} onChange=${e => setOpts({ ...opts, enableNew: e.target.checked })} />Enable newly found models</label>
      <label class="check"><input type="checkbox" checked=${opts.addMeta} onChange=${e => setOpts({ ...opts, addMeta: e.target.checked })} />Fill missing names / limits / modalities from response</label>
      <span class="grow" />
      ${m.fetchedAt && html`<span class="note">Last fetched ${new Date(m.fetchedAt).toLocaleString()}</span>`}
    </div>
    ${err && html`<div class="err" style="margin-top:8px">${err}
      <div class="row" style="margin-top:6px"><button class="small" onClick=${() => setUI({ modal: { type: 'paste', pid, opts } })}>Get curl command & paste result…</button></div></div>`}
  </div>`;
}

function ModelsCard({ pid }) {
  const m = meta(pid);
  const st = modelState(pid);
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('az');
  const [expanded, setExpanded] = useState(null);
  const [opts, setOpts] = useState({ enableNew: st.known.length === 0, addMeta: isCustom(prov(pid)) });
  const fetched = m.fetched ? new Set(m.fetched) : null;
  const newIds = new Set(m.newIds || []);
  const nameOf = id => modelObj(pid, id, false)?.name;
  const ql = q.trim().toLowerCase();
  let ids = st.known.filter(id => !ql || id.toLowerCase().includes(ql) || String(nameOf(id) || '').toLowerCase().includes(ql));
  ids = ids.filter(id => {
    switch (filter) {
      case 'enabled': return st.enabled.has(id);
      case 'disabled': return !st.enabled.has(id);
      case 'new': return newIds.has(id);
      case 'stale': return fetched && !fetched.has(id);
      default: return true;
    }
  });
  if (sort === 'az') ids = [...ids].sort((a, b) => a.localeCompare(b));
  const staleIds = fetched ? st.known.filter(id => !fetched.has(id)) : [];

  return html`<section class="card">
    <div class="row" style="margin-bottom:12px">
      <h3 style="margin:0">Models</h3>
      <span class="badge">${st.enabled.size} / ${st.known.length} enabled</span>
      <span class="grow" />
      <span class="note">Disabled models:</span>
      <select style="width:auto" value=${m.mode} onChange=${e => setMode(pid, e.target.value)}>
        ${Object.entries(MODES[fmtOf(pid)]).map(([k, v]) => html`<option value=${k}>${v}</option>`)}
      </select>
    </div>
    ${m.mode === 'omit' && !isCustom(prov(pid)) && html`<p class="note" style="margin-top:-4px">Note: for built-in providers, omitting a model doesn't hide it — the catalog still provides it. Use ${fmtOf(pid) === 'v2' ? '"disabled": true' : 'blacklist'} mode.</p>`}
    <${FetchBox} pid=${pid} opts=${opts} setOpts=${setOpts} />
    <div class="toolbar">
      <input type="text" placeholder="Search models…" value=${q} onInput=${e => setQ(e.target.value)} />
      <select value=${filter} onChange=${e => setFilter(e.target.value)}>
        <option value="all">All</option><option value="enabled">Enabled</option><option value="disabled">Disabled</option>
        <option value="new">New in last fetch</option><option value="stale" disabled=${!fetched}>Not returned by endpoint</option>
      </select>
      <select value=${sort} onChange=${e => setSort(e.target.value)}><option value="az">A–Z</option><option value="config">Config order</option></select>
      <span class="grow" />
      <button class="small" disabled=${!ids.length} onClick=${() => setEnabled(pid, ids, true)}>Enable ${ids.length === st.known.length ? 'all' : 'shown'}</button>
      <button class="small" disabled=${!ids.length} onClick=${() => setEnabled(pid, ids, false)}>Disable ${ids.length === st.known.length ? 'all' : 'shown'}</button>
      ${staleIds.length > 0 && html`<button class="small danger" title="Remove models the endpoint no longer returns"
        onClick=${() => confirm(`Remove ${staleIds.length} model(s) not returned by the endpoint?\n\n${staleIds.join('\n')}`) && removeModels(pid, staleIds)}>
        Remove ${staleIds.length} stale</button>`}
    </div>
    <div class="mlist">
      ${ids.length === 0 && html`<div class="empty">${st.known.length ? 'No models match.' : 'No models yet — fetch them from the endpoint or add one below.'}</div>`}
      ${ids.map(id => {
        const on = st.enabled.has(id);
        const obj = modelObj(pid, id, false);
        const configured = isObj(obj) && Object.keys(obj).length > 0;
        return html`<div key=${id}>
          <div class=${'mrow' + (on ? '' : ' off')}>
            <input type="checkbox" checked=${on} title=${on ? 'Disable' : 'Enable'} onChange=${() => setEnabled(pid, [id], !on)} />
            <div class="mid" onClick=${() => setExpanded(expanded === id ? null : id)}>
              <span class="mono">${id}</span>
              ${obj?.name && obj.name !== id && html`<span class="muted">${obj.name}</span>`}
            </div>
            ${newIds.has(id) && html`<span class="badge new">new</span>`}
            ${fetched && !fetched.has(id) && html`<span class="badge stale" title="Not returned by the last /models fetch">stale</span>`}
            ${obj?.limit?.context && html`<span class="badge" title="Context window">${fmtTokens(obj.limit.context)} ctx</span>`}
            ${obj?.compatibility?.cacheFormat && html`<span class="badge stale" title="compatibility.cacheFormat: cache_control markers are sent">cache: ${obj.compatibility.cacheFormat}</span>`}
            ${(() => {
              const inMods = getIn(obj, MOD_PATHS[fmtOf(pid)].input);
              if (!Array.isArray(inMods)) return null;
              const extra = inMods.filter(x => x !== 'text');
              return html`<span class="badge" title=${'Input modalities: ' + inMods.join(', ')}>${extra.length ? 'in: ' + extra.join('+') : 'text only'}</span>`;
            })()}
            ${configured && html`<span class="badge cfg" title="Has custom config">cfg</span>`}
            <button class="icon" title="Edit model config" onClick=${() => setExpanded(expanded === id ? null : id)}>${expanded === id ? '▾' : '✎'}</button>
            <button class="icon" title="Remove from config" onClick=${() => removeModels(pid, [id])}>✕</button>
          </div>
          ${expanded === id && html`<${ModelEditor} pid=${pid} id=${id} />`}
        </div>`;
      })}
    </div>
    <div class="row" style="margin-top:10px">
      <div style="width:320px"><${CommitInput} mono clearOnCommit placeholder="Add model by ID and press Enter…" value="" onCommit=${v => addModel(pid, v)} /></div>
    </div>
  </section>`;
}

// Input / output modalities. V1: modalities.{input,output} (both lists required together);
// V2: capabilities.{input,output}.
const MODALITIES = ['text', 'image', 'audio', 'video', 'pdf'];
const MOD_PATHS = {
  v1: { input: ['modalities', 'input'], output: ['modalities', 'output'] },
  v2: { input: ['capabilities', 'input'], output: ['capabilities', 'output'] },
};
// What OpenCode assumes when nothing is set (V2 documents text+image in, text out for unknown models).
const modalityDefaults = fmt => fmt === 'v2' ? { input: ['text', 'image'], output: ['text'] } : { input: ['text'], output: ['text'] };
const sortModalities = list => [...list].sort((a, b) =>
  (MODALITIES.includes(a) ? MODALITIES.indexOf(a) : 99) - (MODALITIES.includes(b) ? MODALITIES.indexOf(b) : 99));

function ModalityEditor({ pid, id, obj }) {
  const fmt = fmtOf(pid), paths = MOD_PATHS[fmt], def = modalityDefaults(fmt);
  const cur = { input: getIn(obj, paths.input), output: getIn(obj, paths.output) };
  const anySet = Array.isArray(cur.input) || Array.isArray(cur.output);
  const toggle = (dir, m, on) => mutate(() => {
    const o = modelObj(pid, id, true);
    for (const d of ['input', 'output']) {
      const existing = getIn(o, paths[d]);
      let list = Array.isArray(existing) ? [...existing] : null;
      if (d === dir) {
        list ??= [...def[d]];
        list = sortModalities(on ? uniq([...list, m]) : list.filter(x => x !== m));
      } else if (fmt === 'v1' && !list) list = [...def[d]];
      if (list) setIn(o, paths[d], list);
    }
  });
  const reset = () => mutate(() => {
    const o = modelObj(pid, id, true);
    setIn(o, paths.input, undefined);
    setIn(o, paths.output, undefined);
  });
  const row = dir => {
    const set = Array.isArray(cur[dir]);
    const list = set ? cur[dir] : def[dir];
    const options = uniq([...MODALITIES, ...(set ? cur[dir] : [])]);
    return html`<div class="row" style="margin-top:4px">
      <span style="width:60px" class="note">${dir}</span>
      ${options.map(m => {
        const checked = list.includes(m);
        return html`<label class="check" style=${set ? '' : 'opacity:.55'}>
          <input type="checkbox" checked=${checked} disabled=${checked && list.length === 1}
            title=${checked && list.length === 1 ? 'At least one modality is required' : ''}
            onChange=${e => toggle(dir, m, e.target.checked)} />${m}</label>`;
      })}
    </div>`;
  };
  return html`<div class="field">
    <span>Modalities (<span class="mono">${paths.input.slice(0, -1).join('.')}.input / .output</span>)</span>
    ${row('input')}${row('output')}
    <div class="row" style="margin-top:4px">
      <small class="muted">${anySet
        ? 'Set explicitly.'
        : fmt === 'v2' ? 'Not set: OpenCode uses the catalog, or text + image in / text out for unknown models (shown faded).'
          : 'Not set: OpenCode uses the models.dev catalog entry (faded boxes show a text-only starting point).'}
        ${fmt === 'v1' && ' OpenCode 1.x also needs "attachment": true before it lets you attach files or images.'}</small>
      <span class="grow" />
      ${anySet && html`<button class="small" onClick=${reset}>Reset to default</button>`}
    </div>
  </div>`;
}

function ModelEditor({ pid, id }) {
  const obj = modelObj(pid, id, false) || {};
  const set = (path, v) => setModelField(pid, id, path, v);
  const g = path => path.reduce((o, k) => o?.[k], obj);
  if (fmtOf(pid) === 'v2') return html`<div class="medit">
    <div class="grid3">
      <${Field} label="Model key" hint="Press Enter to rename"><${CommitInput} mono value=${id} onCommit=${v => mutate(() => renameModelKey(pid, id, v))} /><//>
      <${Field} label="name"><${TextField} value=${obj.name} onChange=${v => set(['name'], v)} placeholder=${id} /><//>
      <${Field} label="modelID (id sent to the API)"><${TextField} mono value=${obj.modelID} onChange=${v => set(['modelID'], v)} placeholder=${id} /><//>
      <${Field} label="limit.context"><${NumField} value=${g(['limit', 'context'])} onChange=${v => set(['limit', 'context'], v)} placeholder="200000" /><//>
      <${Field} label="limit.output"><${NumField} value=${g(['limit', 'output'])} onChange=${v => set(['limit', 'output'], v)} placeholder="32000" /><//>
      <${Field} label="capabilities.tools"><${TriBool} value=${g(['capabilities', 'tools'])} onChange=${v => set(['capabilities', 'tools'], v)} /><//>
      <${Field} label="compatibility.cacheFormat" hint="Unset = no cache_control">
        <select value=${g(['compatibility', 'cacheFormat']) ?? ''} onChange=${e => set(['compatibility', 'cacheFormat'], e.target.value || undefined)}>
          <option value="">— unset —</option><option value="anthropic">anthropic</option><option value="alibaba">alibaba</option></select><//>
    </div>
    <div style="margin-top:10px"><${ModalityEditor} pid=${pid} id=${id} obj=${obj} /></div>
    <details style="margin-top:10px"><summary class="note" style="cursor:pointer">All compatibility overrides for this model</summary>
      <div style="margin-top:8px"><${CompatEditor} modelLevel value=${obj.compatibility} onSet=${(k, v) => set(['compatibility', k], v)} /></div></details>
    <div style="margin-top:10px"><${Field} label="Raw model JSON (settings, headers, body, capabilities, variants, …)">
      <${JsonEditor} rows=${6} value=${obj} requireObject onApply=${v => replaceModel(pid, id, v)} /><//></div>
  </div>`;
  return html`<div class="medit">
    <div class="grid3">
      <${Field} label="Model key" hint="Press Enter to rename"><${CommitInput} mono value=${id} onCommit=${v => mutate(() => renameModelKey(pid, id, v))} /><//>
      <${Field} label="name"><${TextField} value=${obj.name} onChange=${v => set(['name'], v)} placeholder=${id} /><//>
      <${Field} label="id (API model id override)"><${TextField} mono value=${obj.id} onChange=${v => set(['id'], v)} placeholder=${id} /><//>
      <${Field} label="limit.context"><${NumField} value=${g(['limit', 'context'])} onChange=${v => set(['limit', 'context'], v)} placeholder="e.g. 128000" /><//>
      <${Field} label="limit.output"><${NumField} value=${g(['limit', 'output'])} onChange=${v => set(['limit', 'output'], v)} placeholder="e.g. 16384" /><//>
      <${Field} label="tool_call"><${TriBool} value=${obj.tool_call} onChange=${v => set(['tool_call'], v)} /><//>
      <${Field} label="reasoning"><${TriBool} value=${obj.reasoning} onChange=${v => set(['reasoning'], v)} /><//>
      <${Field} label="attachment"><${TriBool} value=${obj.attachment} onChange=${v => set(['attachment'], v)} /><//>
      <${Field} label="temperature"><${TriBool} value=${obj.temperature} onChange=${v => set(['temperature'], v)} /><//>
      <${Field} label="cost.input ($/1M tokens)"><${NumField} value=${g(['cost', 'input'])} onChange=${v => set(['cost', 'input'], v)} /><//>
      <${Field} label="cost.output ($/1M tokens)"><${NumField} value=${g(['cost', 'output'])} onChange=${v => set(['cost', 'output'], v)} /><//>
    </div>
    <div style="margin-top:10px"><${ModalityEditor} pid=${pid} id=${id} obj=${obj} /></div>
    <div style="margin-top:10px"><${Field} label="Raw model JSON (options, modalities, headers, variants, …)">
      <${JsonEditor} rows=${6} value=${obj} requireObject onApply=${v => replaceModel(pid, id, v)} /><//></div>
  </div>`;
}

// ---------------------------------------------------------------- app shell

function Sidebar() {
  const pids = Object.keys(providers());
  const disabled = S.config.disabled_providers || [];
  const select = id => { S.selected = id; persist(); bump(); };
  return html`<aside>
    <div class=${'navitem' + (S.selected === '__general' ? ' active' : '')} onClick=${() => select('__general')}>
      <span class="title">⚙ General</span></div>
    <div class="navlabel">Providers</div>
    ${pids.map(pid => {
      const p = prov(pid);
      const st = isObj(p) ? modelState(pid) : null;
      return html`<div class=${'navitem' + (S.selected === pid ? ' active' : '') + (disabled.includes(pid) ? ' off' : '')}
        onClick=${() => select(pid)} title=${pid}>
        <span class="title">${(isObj(p) && p.name) || pid}</span>
        ${fmtOf(pid) === 'v1' && html`<span class="badge" title="V1 provider entry">v1</span>`}
        ${st && html`<span class="count">${st.enabled.size}/${st.known.length}</span>`}</div>`;
    })}
    ${!pids.length && html`<div class="note" style="padding:4px 9px">No providers yet.</div>`}
    <div style="padding:8px 4px"><button style="width:100%" onClick=${() => setUI({ modal: { type: 'add' } })}>+ Add provider</button></div>
  </aside>`;
}

function OutputPanel({ out, warnings }) {
  return html`<section class="output">
    <div class="tabs">
      <button class=${'tab' + (UI.outputTab === 'output' ? ' active' : '')} onClick=${() => setUI({ outputTab: 'output' })}>Output</button>
      <button class=${'tab' + (UI.outputTab === 'changes' ? ' active' : '')} onClick=${() => setUI({ outputTab: 'changes' })}>
        Changes${out.changes ? ` (${out.changes.length})` : ''}</button>
      <span class="grow" />
      <button class="small" onClick=${() => copy(out.text)}>Copy</button>
      <button class="small primary" onClick=${() => download(out.text)}>Download</button>
    </div>
    ${warnings.length > 0 && html`<div class="warnings">${warnings.map(w => html`<div>${w}</div>`)}</div>`}
    ${UI.outputTab === 'output' ? html`<pre>${out.text}</pre>` : html`<div class="changes">
      ${!out.changes ? html`<p class="note">New config — nothing imported to compare against.</p>`
        : !out.changes.length ? html`<p class="note">No changes from the imported file.</p>`
        : out.changes.map(c => html`<div class="change"><span class=${'k ' + c.kind}>${c.kind}</span>
            <span>${c.path.join(' › ')}${c.kind !== 'removed' ? html`<span class="muted"> = ${JSON.stringify(c.value).slice(0, 80)}</span>` : ''}</span></div>`)}
    </div>`}
  </section>`;
}

function App() {
  useStore();
  const out = useMemo(generateOutput, [version]);
  const warnings = useMemo(computeWarnings, [version]);

  useEffect(() => {
    window.__appMounted = true;
    const key = e => {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    };
    let depth = 0;
    // Local mode edits the file on disk; importing another file would replace its original text.
    const isFile = e => !LOCAL && [...(e.dataTransfer?.types || [])].includes('Files');
    const enter = e => { if (!isFile(e)) return; e.preventDefault(); depth++; setUI({ dragging: true }); };
    const leave = e => { if (!isFile(e)) return; if (--depth <= 0) { depth = 0; setUI({ dragging: false }); } };
    const over = e => { if (isFile(e)) e.preventDefault(); };
    const drop = e => {
      if (!isFile(e)) return;
      e.preventDefault(); depth = 0; setUI({ dragging: false });
      const f = e.dataTransfer.files[0];
      if (f && (S.origText == null || confirm(`Replace the current config with ${f.name}?`))) importFile(f);
    };
    window.addEventListener('keydown', key);
    window.addEventListener('dragenter', enter);
    window.addEventListener('dragleave', leave);
    window.addEventListener('dragover', over);
    window.addEventListener('drop', drop);
    return () => {
      window.removeEventListener('keydown', key);
      window.removeEventListener('dragenter', enter);
      window.removeEventListener('dragleave', leave);
      window.removeEventListener('dragover', over);
      window.removeEventListener('drop', drop);
    };
  }, []);

  const changed = out.changes ? out.changes.length : null;
  const sel = S.selected !== '__general' && hasOwn(providers(), S.selected) ? S.selected : '__general';
  return html`<div class="shell">
    <header>
      <h1><span>◆</span> OpenCode Config Editor</h1>
      <span class="filechip">${S.fileName}${changed ? html` <b>● ${changed} change${changed > 1 ? 's' : ''}</b>` : ''}</span>
      <span class="grow" />
      <select style="width:auto" value=${targetVersion()} onChange=${e => setTarget(e.target.value)} title="Target OpenCode version">
        <option value="v1">OpenCode 1.x</option><option value="v2">OpenCode 2.x</option></select>
      ${!LOCAL && html`<button onClick=${newConfig}>New</button>
      <button class="primary" onClick=${() => setUI({ modal: { type: 'import' } })}>Import…</button>`}
      ${S.origText != null && html`<button disabled=${!changed} title="Discard all edits"
        onClick=${() => confirm('Discard all edits and revert to the imported file?') && mutate(() => { S.config = clone(S.origConfig); S.stash = {}; S.meta = {}; })}>Revert</button>`}
      <button disabled=${!history.length} onClick=${undo} title="Undo (Ctrl+Z)">↶ Undo</button>
      <button disabled=${!future.length} onClick=${redo} title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
      <button onClick=${() => setUI({ showOutput: !UI.showOutput })}>${UI.showOutput ? 'Hide' : 'Show'} output</button>
      <button onClick=${() => copy(out.text)}>Copy</button>
      ${LOCAL ? html`<button onClick=${() => confirm(LOCAL.returnUrl ? 'Discard these edits and go back to the setup page?' : 'Discard the browser edits and go back to the terminal?') && localFinish('cancel')}>Cancel</button>
      <button class="primary" onClick=${() => localFinish('save', out.text)}>Save to system</button>`
        : html`<button class="primary" onClick=${() => download(out.text)}>Download</button>`}
    </header>
    ${LOCAL && html`<div class="localbar">Editing <b class="mono">${LOCAL.path}</b>. ${LOCAL.returnUrl
      ? '"Save to system" returns to the setup page, which shows the changes before anything is written (a backup is kept).'
      : '"Save to system" hands the result back to the terminal, which shows the changes and asks before writing (a backup is kept).'}</div>`}
    <div class=${'layout' + (UI.showOutput ? '' : ' no-output')}>
      <${Sidebar} />
      <main class="editor">${sel === '__general' ? html`<${GeneralEditor} />` : html`<${ProviderEditor} key=${sel} pid=${sel} />`}</main>
      ${UI.showOutput && html`<${OutputPanel} out=${out} warnings=${warnings} />`}
    </div>
    ${UI.modal?.type === 'import' && html`<${ImportModal} />`}
    ${UI.modal?.type === 'add' && html`<${AddProviderModal} />`}
    ${UI.modal?.type === 'paste' && html`<${PasteResponseModal} pid=${UI.modal.pid} opts=${UI.modal.opts} />`}
    ${UI.modal?.type === 'plugin' && html`<${PluginModal} pid=${UI.modal.pid} />`}
    ${UI.modal?.type === 'alias' && html`<${AliasModal} pid=${UI.modal.pid} />`}
    ${UI.modal?.type === 'anthropic' && html`<${AnthropicModal} pid=${UI.modal.pid} />`}
    ${UI.toast && html`<div class=${'toast' + (UI.toast.error ? ' error' : '')}>${UI.toast.msg}</div>`}
    ${UI.dragging && html`<div class="dropzone">Drop opencode.json to import</div>`}
    ${UI.localDone && html`<div class="localdone"><b>${UI.localDone}</b><span class="muted">You can close this tab.</span></div>`}
  </div>`;
}

if (LOCAL) {
  localBoot().then(() => render(html`<${App} />`, document.getElementById('app'))).catch(e => {
    window.__appMounted = true;
    document.querySelector('.boot').textContent = 'Could not load the config from the setup script: ' + e.message;
  });
} else {
  load();
  render(html`<${App} />`, document.getElementById('app'));
}
</script>
</body>
</html>
