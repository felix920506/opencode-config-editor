<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Config Editor</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161920; --panel2: #1c2029; --border: #2a2f3a; --text: #e3e6ec;
    --muted: #8a91a0; --accent: #6aa9ff; --accent2: #3d7be0; --ok: #4cc38a; --warn: #e5b452;
    --danger: #ef6b6b; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); }
  .grow { flex: 1; }
  .err { color: var(--danger); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); }
  button.icon { padding: 2px 7px; background: transparent; border-color: transparent; color: var(--muted); }
  button.icon:hover { color: var(--text); border-color: var(--border); }
  button.small { padding: 2px 8px; font-size: 12.5px; }
  input[type=text], input[type=password], input[type=number], input:not([type]), select, textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; font-family: var(--mono); font-size: 12.5px; }
  input[type=checkbox] { accent-color: var(--accent2); width: 15px; height: 15px; margin: 0; cursor: pointer; }

  #app { height: 100%; }
  .boot { padding: 40px; color: var(--muted); }
  .shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .filechip { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; }
  .filechip b { color: var(--warn); font-weight: normal; }
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) minmax(320px, 38%); min-height: 0; }
  .layout.no-output { grid-template-columns: 250px minmax(0, 1fr); }
  aside, .editor, .output { overflow: auto; min-height: 0; }
  aside { border-right: 1px solid var(--border); background: var(--panel); padding: 10px 8px; }
  .navitem { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 6px; cursor: pointer; }
  .navitem:hover { background: var(--panel2); }
  .navitem.active { background: #23324d; }
  .navitem .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navitem .count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .navitem.off .title { text-decoration: line-through; color: var(--muted); }
  .navlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 9px 4px; }
  .editor { padding: 18px 22px 60px; }
  .output { border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  .output .tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); align-items: center; position: sticky; top: 0; background: var(--panel); }
  .tab { background: transparent; border-color: transparent; }
  .tab.active { border-color: var(--border); background: var(--panel2); }
  .output pre { margin: 0; padding: 12px 14px; font-family: var(--mono); font-size: 12px; white-space: pre; flex: 1; }
  .changes { padding: 10px 14px; }
  .change { font-family: var(--mono); font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 8px; }
  .change .k { width: 62px; flex: none; }
  .k.added { color: var(--ok); } .k.removed { color: var(--danger); } .k.changed { color: var(--warn); }
  .warnings { padding: 8px 14px; border-bottom: 1px solid var(--border); background: #2a2414; color: var(--warn); font-size: 12.5px; }
  .warnings div::before { content: "⚠ "; }

  h2 { margin: 0; font-size: 20px; font-weight: 600; }
  h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .pe-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  details.card > summary { cursor: pointer; font-weight: 600; }
  details.card[open] > summary { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > span { font-size: 12px; color: var(--muted); }
  .field > small { font-size: 11.5px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  .check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .json-editor .row { margin-top: 6px; }
  .pwd { display: flex; gap: 4px; }
  .note { font-size: 12.5px; color: var(--muted); }
  .fetchbox { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .toolbar input[type=text] { width: 220px; }
  .toolbar select { width: auto; }
  .mlist { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .mrow:last-child { border-bottom: none; }
  .mrow:hover { background: var(--panel2); }
  .mrow.off .mid .mono { color: var(--muted); text-decoration: line-through; }
  .mrow .mid { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: baseline; cursor: pointer; overflow: hidden; }
  .mrow .mid > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 9px; border: 1px solid var(--border); color: var(--muted); flex: none; font-family: var(--mono); }
  .badge.new { color: var(--ok); border-color: var(--ok); }
  .badge.stale { color: var(--warn); border-color: var(--warn); }
  .badge.cfg { color: var(--accent); border-color: var(--accent); }
  .medit { padding: 12px 14px 14px 36px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; width: min(680px, 94vw); max-height: 90vh; overflow: auto; }
  .modal h3 { font-size: 16px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .tpl { text-align: left; padding: 8px 10px; }
  .tpl.active { border-color: var(--accent); background: #23324d; }
  .tpl small { display: block; color: var(--muted); font-size: 11.5px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .toast.error { border-color: var(--danger); }
  .localbar { background: #23324d; border-bottom: 1px solid var(--border); padding: 7px 14px; font-size: 13px; }
  .localdone { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 16px; }
  .dropzone { position: fixed; inset: 0; background: rgba(61,123,224,.18); border: 3px dashed var(--accent); z-index: 30; display: flex; align-items: center; justify-content: center; font-size: 22px; pointer-events: none; }
</style>
</head>
<body>
<div id="app"><div class="boot">Loading editor… (requires access to cdn.jsdelivr.net)</div></div>
<script>
  setTimeout(function () {
    if (!window.__appMounted) document.querySelector('.boot').textContent =
      'Failed to load dependencies from cdn.jsdelivr.net. Check your network connection.';
  }, 8000);
</script>
<script type="module">
import { html, render, useState, useEffect, useMemo, useRef } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';
import * as jsonc from 'https://cdn.jsdelivr.net/npm/jsonc-parser@3.3.1/+esm';

// ---------------------------------------------------------------- constants

const LS_KEY = 'opencode-config-editor:v1';
// Local mode: a local program (for example a setup script) that serves this page can inject
//   window.__OPENCODE_LOCAL__ = { api, path, providerId?, target?, auth?, returnUrl? }
// in a script element before the end of head. The editor then edits the config file on that
// machine instead of importing and downloading files; without it the page behaves as usual.
// The program provides:
//   GET  {api}/config        -> { path, text, planned?, models? }  text: the file on disk ("" if
//                               missing); planned: the config to start from (default: the file);
//                               models: model IDs to list for providerId (auth default "bearer")
//   ANY  {api}/proxy?url=... -> forwards the editor's /models and test requests
//   POST {api}/save   { text } -> the edited file text; POST {api}/cancel -> the user cancelled
// With returnUrl the page navigates there after Save or Cancel. Keep the global's name: hosts
// check that the page contains it. examples/local_host.py is a sample host.
const LOCAL = window.__OPENCODE_LOCAL__ || null;
const SCHEMA_URL = 'https://opencode.ai/config.json';

const KNOWN_BASE = {
  openai: 'https://api.openai.com/v1',
  anthropic: 'https://api.anthropic.com/v1',
  openrouter: 'https://openrouter.ai/api/v1',
  google: 'https://generativelanguage.googleapis.com/v1beta',
  groq: 'https://api.groq.com/openai/v1',
  deepseek: 'https://api.deepseek.com/v1',
  mistral: 'https://api.mistral.ai/v1',
  xai: 'https://api.x.ai/v1',
  togetherai: 'https://api.together.xyz/v1',
  fireworks: 'https://api.fireworks.ai/inference/v1',
  cerebras: 'https://api.cerebras.ai/v1',
  ollama: 'http://localhost:11434/v1',
  lmstudio: 'http://127.0.0.1:1234/v1',
};

const V2_PACKAGES = () => ['@opencode/ai/providers/openai-compatible', ...NPM_PACKAGES.map(n => 'aisdk:' + n)];

const NPM_PACKAGES = [
  '@ai-sdk/openai-compatible', '@ai-sdk/openai', '@ai-sdk/anthropic', '@ai-sdk/google',
  '@ai-sdk/google-vertex', '@ai-sdk/azure', '@ai-sdk/amazon-bedrock', '@ai-sdk/mistral',
  '@ai-sdk/groq', '@ai-sdk/xai', '@ai-sdk/deepseek', '@ai-sdk/togetherai', '@ai-sdk/cerebras',
  '@openrouter/ai-sdk-provider',
];

const TEMPLATES = [
  { key: 'custom', label: 'OpenAI-compatible', desc: 'Any /v1 compatible endpoint', id: 'my-provider',
    obj: { npm: '@ai-sdk/openai-compatible', name: 'My Provider', options: { baseURL: 'https://api.example.com/v1', apiKey: '{env:MY_PROVIDER_API_KEY}' } } },
  { key: 'ollama', label: 'Ollama', desc: 'Local, localhost:11434', id: 'ollama',
    obj: { npm: '@ai-sdk/openai-compatible', name: 'Ollama', options: { baseURL: 'http://localhost:11434/v1' } } },
  { key: 'lmstudio', label: 'LM Studio', desc: 'Local, 127.0.0.1:1234', id: 'lmstudio',
    obj: { npm: '@ai-sdk/openai-compatible', name: 'LM Studio', options: { baseURL: 'http://127.0.0.1:1234/v1' } } },
  { key: 'llamacpp', label: 'llama.cpp server', desc: 'Local, 127.0.0.1:8080', id: 'llama.cpp',
    obj: { npm: '@ai-sdk/openai-compatible', name: 'llama.cpp', options: { baseURL: 'http://127.0.0.1:8080/v1' } } },
  { key: 'litellm', label: 'LiteLLM proxy', desc: 'OpenAI-compatible gateway', id: 'litellm',
    obj: { npm: '@ai-sdk/openai-compatible', name: 'LiteLLM', options: { baseURL: 'http://localhost:4000/v1', apiKey: '{env:LITELLM_API_KEY}' } } },
  { key: 'anthropic-compat', label: 'Anthropic-compatible', desc: 'Gateway with /v1/messages', id: 'my-anthropic',
    obj: { npm: '@ai-sdk/anthropic', name: 'My Anthropic Gateway', options: { baseURL: 'https://api.example.com/v1', apiKey: '{env:MY_GATEWAY_API_KEY}' } } },
  { key: 'openrouter', label: 'OpenRouter', desc: 'Built-in provider', id: 'openrouter', builtin: true, obj: {} },
  { key: 'openai', label: 'OpenAI', desc: 'Built-in provider', id: 'openai', builtin: true, obj: {} },
  { key: 'anthropic', label: 'Anthropic', desc: 'Built-in provider', id: 'anthropic', builtin: true, obj: {} },
  { key: 'google', label: 'Google Gemini', desc: 'Built-in provider', id: 'google', builtin: true, obj: {} },
  { key: 'empty', label: 'Empty', desc: 'Start from scratch', id: 'provider', obj: {} },
];

const MODES = {
  v1: {
    omit: 'Omit disabled models from "models"',
    blacklist: 'Keep all, list disabled in "blacklist"',
    whitelist: 'Keep all, list enabled in "whitelist"',
  },
  v2: {
    disabled: 'Mark disabled models with "disabled": true',
    omit: 'Omit disabled models from "models"',
  },
};

// ---------------------------------------------------------------- helpers

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const uniq = arr => [...new Set(arr)];
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

function deepEqual(a, b) {
  if (a === b) return true;
  if (Array.isArray(a)) return Array.isArray(b) && a.length === b.length && a.every((x, i) => deepEqual(x, b[i]));
  if (isObj(a) && isObj(b)) {
    const ka = Object.keys(a), kb = Object.keys(b);
    return ka.length === kb.length && ka.every(k => hasOwn(b, k) && deepEqual(a[k], b[k]));
  }
  return false;
}

// Set a nested value; `undefined` deletes and prunes parents left empty (never `o` itself).
function setIn(o, path, v) {
  if (v === undefined) {
    const stack = [];
    let cur = o;
    for (let i = 0; i < path.length - 1; i++) {
      if (!isObj(cur[path[i]])) return;
      stack.push([cur, path[i]]);
      cur = cur[path[i]];
    }
    delete cur[path[path.length - 1]];
    for (let i = stack.length - 1; i >= 0; i--) {
      const [parent, key] = stack[i];
      if (Object.keys(parent[key]).length === 0) delete parent[key]; else break;
    }
    return;
  }
  let cur = o;
  for (let i = 0; i < path.length - 1; i++) {
    if (!isObj(cur[path[i]])) cur[path[i]] = {};
    cur = cur[path[i]];
  }
  cur[path[path.length - 1]] = v;
}

function lineCol(text, offset) {
  const before = text.slice(0, offset).split('\n');
  return { line: before.length, col: before[before.length - 1].length + 1 };
}

function parseJsonc(text) {
  const errors = [];
  const v = jsonc.parse(text, errors, { allowTrailingComma: true, disallowComments: false });
  if (errors.length) {
    const e = errors[0], pos = lineCol(text, e.offset);
    throw new Error(`${jsonc.printParseErrorCode(e.error)} at line ${pos.line}, column ${pos.col}`);
  }
  return v;
}

function fmtTokens(n) {
  if (typeof n !== 'number') return '';
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k';
  return String(n);
}

const isSecretRef = s => typeof s === 'string' && /\{(env|file):/.test(s);

// ---------------------------------------------------------------- store

const S = {
  config: { $schema: SCHEMA_URL },
  origText: null,      // imported file text (JSONC); output is produced by applying edits to it
  origConfig: null,
  fileName: 'opencode.json',
  stash: {},           // pid -> modelId -> model config not currently in "models" (fetched / omitted)
  meta: {},            // pid -> { mode, fetchUrl, auth, fetched, fetchedAt, newIds }
  settings: { corsProxy: '' },
  selected: '__general',
};
const UI = { modal: null, toast: null, outputTab: 'output', showOutput: true, dragging: false };
const sessionKeys = {}; // API keys typed for fetching only; never persisted

let version = 0;
const listeners = new Set();
const bump = () => { version++; listeners.forEach(l => l()); };
const history = [], future = [];
let lastKey = null, lastTime = 0;

const snapshot = () => JSON.stringify({ config: S.config, stash: S.stash, meta: S.meta, selected: S.selected });
function restore(snap) { Object.assign(S, JSON.parse(snap)); }

function persist() {
  if (LOCAL) return; // the file on disk is the source of truth; never mix in an old session
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      config: S.config, origText: S.origText, fileName: S.fileName, stash: S.stash,
      meta: S.meta, settings: S.settings, selected: S.selected,
    }));
  } catch (e) { console.warn('persist failed', e); }
}

function load() {
  if (LOCAL) return;
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && isObj(d.config)) {
      Object.assign(S, d);
      S.settings = { corsProxy: '', ...(d.settings || {}) };
      S.origConfig = S.origText != null ? parseJsonc(S.origText) : null;
    }
  } catch (e) { console.warn('load failed', e); }
}

// Mutations with the same key within a short window coalesce into one undo step (typing).
function mutate(fn, key) {
  const now = Date.now();
  if (!(key && key === lastKey && now - lastTime < 1500)) {
    history.push(snapshot());
    if (history.length > 200) history.shift();
    future.length = 0;
  }
  lastKey = key; lastTime = now;
  fn();
  persist();
  bump();
}
function undo() { if (!history.length) return; future.push(snapshot()); restore(history.pop()); lastKey = null; persist(); bump(); }
function redo() { if (!future.length) return; history.push(snapshot()); restore(future.pop()); lastKey = null; persist(); bump(); }
function setUI(patch) { Object.assign(UI, patch); bump(); }

let toastTimer;
function toast(msg, error = false) {
  clearTimeout(toastTimer);
  setUI({ toast: { msg, error } });
  toastTimer = setTimeout(() => setUI({ toast: null }), 3500);
}

function useStore() {
  const [, set] = useState(0);
  useEffect(() => { const l = () => set(v => v + 1); listeners.add(l); return () => listeners.delete(l); }, []);
}

// ---------------------------------------------------------------- providers & models
//
// Provider entries can live in the V1 map ("provider": npm/options/blacklist...) or the native
// V2 map ("providers": package/settings/headers/body/compatibility, models with "disabled").
// OpenCode 2 reads both, but each entry must be entirely one format.

const v1Map = () => isObj(S.config.provider) ? S.config.provider : {};
const v2Map = () => isObj(S.config.providers) ? S.config.providers : {};
const providers = () => ({ ...v1Map(), ...v2Map() }); // V2 wins when an id is in both
const prov = pid => providers()[pid];
const fmtOf = pid => hasOwn(v2Map(), pid) ? 'v2' : 'v1';
const rootKey = pid => fmtOf(pid) === 'v2' ? 'providers' : 'provider';

// Where each concept lives per format.
const PATHS = {
  v1: { pkg: ['npm'], baseURL: ['options', 'baseURL'], apiKey: ['options', 'apiKey'], headers: ['options', 'headers'], modelId: ['id'] },
  v2: { pkg: ['package'], baseURL: ['settings', 'baseURL'], apiKey: ['settings', 'apiKey'], headers: ['headers'], modelId: ['modelID'] },
};
const P = pid => PATHS[fmtOf(pid)];
const getIn = (o, path) => path.reduce((x, k) => (x == null ? undefined : x[k]), o);
const pkgOf = p => (isObj(p) && (p.package || p.npm)) || '';
const isCustom = p => isObj(p) && !!(p.npm || p.package || p.options?.baseURL || p.settings?.baseURL);
// Ids that make OpenCode treat a model as Anthropic (and attach cache_control in 1.x).
const isClaude = (id, obj) => /claude|anthropic/i.test(id + ' ' + (obj?.modelID || obj?.id || ''));

function inferMode(pid, p) {
  if (fmtOf(pid) === 'v2') return 'disabled';
  if (!isObj(p)) return 'omit';
  if (Array.isArray(p.whitelist)) return 'whitelist';
  if (Array.isArray(p.blacklist) && p.blacklist.length) return 'blacklist';
  if (!isCustom(p)) return 'blacklist'; // built-in provider: models come from the catalog
  return 'omit';
}
function meta(pid) {
  const m = S.meta[pid] ||= {};
  if (!MODES[fmtOf(pid)][m.mode]) m.mode = inferMode(pid, prov(pid));
  return m;
}

function modelState(pid) {
  const p = prov(pid) || {}, m = meta(pid);
  const models = isObj(p.models) ? p.models : {};
  const stash = S.stash[pid] || {};
  if (fmtOf(pid) === 'v2') {
    const isDis = id => isObj(models[id]) && models[id].disabled === true;
    const known = uniq([...Object.keys(models), ...Object.keys(stash), ...(m.fetched || [])]);
    const enabled = m.mode === 'omit'
      ? new Set(Object.keys(models).filter(id => !isDis(id)))
      // Built-in providers serve catalog models that aren't listed; custom ones only serve listed models.
      : new Set(known.filter(id => hasOwn(models, id) ? !isDis(id) : !isCustom(p)));
    return { known, enabled, models, stash, bl: [], wl: null };
  }
  const bl = Array.isArray(p.blacklist) ? p.blacklist : [];
  const wl = Array.isArray(p.whitelist) ? p.whitelist : null;
  const known = uniq([...Object.keys(models), ...Object.keys(stash), ...bl, ...(wl || []), ...(m.fetched || [])]);
  let enabled;
  if (m.mode === 'whitelist') enabled = new Set((wl || []).filter(id => !bl.includes(id)));
  else if (m.mode === 'blacklist') enabled = new Set(known.filter(id => !bl.includes(id)));
  else enabled = new Set(Object.keys(models).filter(id => !bl.includes(id)));
  return { known, enabled, models, stash, bl, wl };
}

// Rewrite the provider so exactly `enabled` models are active under `mode`.
function applyEnabled(pid, enabled, mode) {
  const p = prov(pid);
  const st = modelState(pid);
  const stash = S.stash[pid] ||= {};
  const v2 = fmtOf(pid) === 'v2';
  if (!isObj(p.models)) p.models = {};
  for (const id of st.known) {
    const inModels = hasOwn(p.models, id);
    // Built-in providers get models from the catalog, so only add entries that carry config.
    const fromStash = hasOwn(stash, id) && (isCustom(p) || Object.keys(stash[id] || {}).length > 0);
    if (enabled.has(id)) {
      if (inModels) {
        if (v2 && isObj(p.models[id]) && hasOwn(p.models[id], 'disabled')) {
          delete p.models[id].disabled;
          if (!isCustom(p) && !Object.keys(p.models[id]).length) delete p.models[id];
        }
      } else if (mode === 'omit' || fromStash) {
        p.models[id] = stash[id] ?? {};
        delete stash[id];
      }
    } else if (mode === 'omit') {
      if (inModels) {
        stash[id] = p.models[id];
        if (isObj(stash[id])) delete stash[id].disabled;
        delete p.models[id];
      }
    } else if (v2 && mode === 'disabled') {
      if (inModels) {
        if (!isObj(p.models[id])) p.models[id] = {};
        p.models[id].disabled = true;
      } else if (!isCustom(p)) {
        p.models[id] = { ...(isObj(stash[id]) ? stash[id] : {}), disabled: true };
        delete stash[id];
      }
    }
  }
  if (!v2) {
    const disabled = st.known.filter(id => !enabled.has(id));
    if (mode === 'blacklist' && disabled.length) p.blacklist = disabled; else delete p.blacklist;
    if (mode === 'whitelist') p.whitelist = st.known.filter(id => enabled.has(id)); else delete p.whitelist;
  }
  if (!Object.keys(p.models).length) delete p.models;
  meta(pid).mode = mode;
}

function setEnabled(pid, ids, on) {
  mutate(() => {
    const st = modelState(pid);
    const E = new Set(st.enabled);
    ids.forEach(id => on ? E.add(id) : E.delete(id));
    applyEnabled(pid, E, meta(pid).mode);
  });
}

function setMode(pid, mode) {
  mutate(() => applyEnabled(pid, modelState(pid).enabled, mode));
}

// The object holding a model's config: in "models" if present (or if it is active), else the stash.
function modelObj(pid, id, create) {
  const p = prov(pid);
  if (isObj(p.models) && isObj(p.models[id])) return p.models[id];
  const stash = S.stash[pid] ||= {};
  if (!create) return stash[id];
  if (modelState(pid).enabled.has(id)) {
    if (!isObj(p.models)) p.models = {};
    p.models[id] = isObj(stash[id]) ? stash[id] : {};
    delete stash[id];
    return p.models[id];
  }
  if (!isObj(stash[id])) stash[id] = {};
  return stash[id];
}

function setModelField(pid, id, path, v) {
  mutate(() => setIn(modelObj(pid, id, true), path, v), `m:${pid}:${id}:${path.join('.')}`);
}

function replaceModel(pid, id, v) {
  mutate(() => {
    const p = prov(pid);
    if (isObj(p.models) && hasOwn(p.models, id)) p.models[id] = v ?? {};
    else if (modelState(pid).enabled.has(id) && meta(pid).mode !== 'blacklist') { p.models ||= {}; p.models[id] = v ?? {}; }
    else (S.stash[pid] ||= {})[id] = v ?? {};
  });
}

function addModel(pid, id) {
  id = id.trim();
  if (!id) return;
  if (modelState(pid).known.includes(id)) { toast(`Model "${id}" already exists`, true); return; }
  mutate(() => {
    (S.stash[pid] ||= {})[id] = {};
    const E = new Set(modelState(pid).enabled); E.add(id);
    applyEnabled(pid, E, meta(pid).mode);
  });
}

function removeModels(pid, ids) {
  mutate(() => {
    const p = prov(pid), m = meta(pid);
    for (const id of ids) {
      if (isObj(p.models)) delete p.models[id];
      if (S.stash[pid]) delete S.stash[pid][id];
      if (Array.isArray(p.blacklist)) p.blacklist = p.blacklist.filter(x => x !== id);
      if (Array.isArray(p.whitelist)) p.whitelist = p.whitelist.filter(x => x !== id);
      if (m.fetched) m.fetched = m.fetched.filter(x => x !== id);
    }
    if (isObj(p.models) && !Object.keys(p.models).length) delete p.models;
    if (Array.isArray(p.blacklist) && !p.blacklist.length) delete p.blacklist;
  });
}

function renameProvider(old, nw) {
  nw = (nw || '').trim();
  if (!nw || nw === old) return;
  if (hasOwn(providers(), nw)) { toast(`Provider "${nw}" already exists`, true); return; }
  mutate(() => {
    const key = rootKey(old);
    const out = {};
    for (const k of Object.keys(S.config[key])) out[k === old ? nw : k] = S.config[key][k];
    S.config[key] = out;
    for (const store of [S.meta, S.stash]) if (store[old]) { store[nw] = store[old]; delete store[old]; }
    const fix = v => typeof v === 'string' && v.startsWith(old + '/') ? nw + v.slice(old.length) : v;
    for (const k of ['model', 'small_model']) if (hasOwn(S.config, k)) S.config[k] = fix(S.config[k]);
    for (const sect of ['agent', 'agents', 'mode']) {
      if (isObj(S.config[sect])) for (const a of Object.values(S.config[sect])) if (isObj(a) && a.model) a.model = fix(a.model);
    }
    for (const k of ['disabled_providers', 'enabled_providers']) {
      if (Array.isArray(S.config[k])) S.config[k] = S.config[k].map(x => x === old ? nw : x);
    }
    S.selected = nw;
  });
}

function deleteProvider(pid) {
  if (!confirm(`Delete provider "${pid}" from the config?`)) return;
  mutate(() => {
    const key = rootKey(pid);
    delete S.config[key][pid];
    if (!Object.keys(S.config[key]).length) delete S.config[key];
    if (!hasOwn(providers(), pid)) { delete S.meta[pid]; delete S.stash[pid]; }
    S.selected = Object.keys(providers())[0] || '__general';
  });
}

function toggleProviderDisabled(pid, disable) {
  mutate(() => {
    let arr = Array.isArray(S.config.disabled_providers) ? S.config.disabled_providers.filter(x => x !== pid) : [];
    if (disable) arr.push(pid);
    if (arr.length) S.config.disabled_providers = arr; else delete S.config.disabled_providers;
  });
}

function addProvider(id, tpl, format) {
  mutate(() => {
    const key = format === 'v2' ? 'providers' : 'provider';
    if (!isObj(S.config[key])) S.config[key] = {};
    S.config[key][id] = format === 'v2' ? v1ProviderToV2(clone(tpl.obj)).obj : clone(tpl.obj);
    S.meta[id] = {};
    S.selected = id;
  });
}

function setProviderEntry(pid, v) {
  mutate(() => { S.config[rootKey(pid)][pid] = v; });
}

// ---------------------------------------------------------------- V1 -> V2 conversion
// Mapping per https://opencode.ai/v2/docs/migrate-v1/

const NATIVE_OAI = '@opencode/ai/providers/openai-compatible';
const ZEN_ID = 'opencode'; // built-in OpenCode Zen provider
const V1_IGNORED_MODEL_FIELDS = ['release_date', 'attachment', 'reasoning', 'temperature', 'experimental'];

function v1ModelToV2(mo, notes, where) {
  if (!isObj(mo)) return mo;
  const out = {};
  const caps = () => (out.capabilities ||= {});
  for (const [k, v] of Object.entries(mo)) {
    if (k === 'id') out.modelID = v;
    else if (k === 'tool_call') caps().tools = v;
    else if (k === 'modalities' && isObj(v)) {
      if (v.input) caps().input = v.input;
      if (v.output) caps().output = v.output;
    } else if (k === 'status') {
      if (v === 'deprecated') out.disabled = true; else notes.push(`${where}: dropped "status": "${v}" (V2 only supports deprecated → disabled)`);
    } else if (k === 'options') out.settings = { ...(out.settings || {}), ...(isObj(v) ? v : {}) };
    else if (k === 'cost' && isObj(v)) {
      const { cache_read, cache_write, ...rest } = v;
      out.cost = { ...rest };
      if (cache_read !== undefined || cache_write !== undefined) {
        out.cost.cache = {};
        if (cache_read !== undefined) out.cost.cache.read = cache_read;
        if (cache_write !== undefined) out.cost.cache.write = cache_write;
      }
    } else if (k === 'variants' && isObj(v)) {
      out.variants = Object.entries(v).map(([id, vv]) => isObj(vv) && Object.keys(vv).length ? { id, settings: vv } : { id });
      notes.push(`${where}: variants converted to an array with their options under "settings" — review them`);
    } else if (k === 'interleaved' && typeof v === 'boolean') notes.push(`${where}: dropped boolean "interleaved" (ignored by V2)`);
    else if (V1_IGNORED_MODEL_FIELDS.includes(k)) notes.push(`${where}: dropped "${k}" (ignored by V2)`);
    else out[k] = v;
  }
  return out;
}

function v1ProviderToV2(p, pid = 'provider') {
  const notes = [];
  if (!isObj(p)) return { obj: p, notes };
  const out = {};
  const settings = () => (out.settings ||= {});
  for (const [k, v] of Object.entries(p)) {
    if (k === 'npm') {
      out.package = v === '@ai-sdk/openai-compatible' ? NATIVE_OAI : String(v).startsWith('aisdk:') ? v : 'aisdk:' + v;
      if (v === '@ai-sdk/openai-compatible') notes.push(`${pid}: "@ai-sdk/openai-compatible" → native "${NATIVE_OAI}" (supports "compatibility")`);
    } else if (k === 'api') { if (typeof v === 'string') settings().baseURL ??= v; }
    else if (k === 'options' && isObj(v)) {
      for (const [ok, ov] of Object.entries(v)) {
        if (ok === 'headers') out.headers = ov;
        else if (ok === 'setCacheKey') (out.compatibility ||= {}).supportsPromptCacheKey = ov;
        else settings()[ok] = ov;
      }
    } else if (k === 'models' && isObj(v)) {
      out.models = {};
      for (const [mid, mo] of Object.entries(v)) out.models[mid] = v1ModelToV2(mo, notes, `${pid}/${mid}`);
    } else if (k === 'whitelist' || k === 'blacklist') { /* handled below */ }
    else if (k === 'id') notes.push(`${pid}: dropped provider "id" (ignored by V2)`);
    else out[k] = v;
  }
  const disable = id => {
    out.models ||= {};
    out.models[id] = { ...(isObj(out.models[id]) ? out.models[id] : {}), disabled: true };
  };
  if (Array.isArray(p.blacklist)) p.blacklist.forEach(disable);
  if (Array.isArray(p.whitelist)) {
    Object.keys(out.models || {}).filter(id => !p.whitelist.includes(id)).forEach(disable);
    if (!isCustom(p)) notes.push(`${pid}: whitelist can only be converted for models listed in the config; other catalog models stay enabled`);
  }
  return { obj: out, notes };
}

function convertProviderToV2(pid) {
  if (fmtOf(pid) === 'v2') return;
  const { obj, notes } = v1ProviderToV2(clone(prov(pid)), pid);
  if (hasOwn(v2Map(), pid)) { toast(`"providers" already has an entry named ${pid}`, true); return; }
  const msg = `Convert "${pid}" to the native OpenCode 2 format?\n\nIt moves from "provider" to "providers"; npm → package, options → settings/headers, ` +
    `blacklist/whitelist → "disabled": true on models.` + (notes.length ? `\n\nNotes:\n• ${notes.join('\n• ')}` : '');
  if (!confirm(msg)) return;
  mutate(() => {
    delete S.config.provider[pid];
    if (!Object.keys(S.config.provider).length) delete S.config.provider;
    if (!isObj(S.config.providers)) S.config.providers = {};
    S.config.providers[pid] = obj;
    S.meta[pid] = { ...(S.meta[pid] || {}), mode: 'disabled' };
  });
}

// ---------------------------------------------------------------- target OpenCode version, V2 -> V1 conversion

// Which OpenCode the file is for. Explicit choice, else inferred: any "providers" entry means 2.x.
const targetVersion = () => S.settings.target || (Object.keys(v2Map()).length ? 'v2' : Object.keys(v1Map()).length ? 'v1' : 'v2');
function setTarget(v) { S.settings.target = v; persist(); bump(); }

function v2ModelToV1(mo, notes, where) {
  if (!isObj(mo)) return { obj: mo, disabled: false };
  const out = {};
  let disabled = false;
  for (const [k, v] of Object.entries(mo)) {
    if (k === 'modelID') out.id = v;
    else if (k === 'capabilities' && isObj(v)) {
      for (const [ck, cv] of Object.entries(v)) {
        if (ck === 'tools') out.tool_call = cv;
        else if (ck === 'input' || ck === 'output') (out.modalities ||= {})[ck] = cv;
        else if (ck === 'reasoning' && typeof cv === 'boolean') out.reasoning = cv;
        else if (ck === 'reasoning' && isObj(cv) && hasOwn(cv, 'supported')) {
          out.reasoning = !!cv.supported;
          if (Object.keys(cv).length > 1) notes.push(`${where}: only capabilities.reasoning.supported kept (V1 has a boolean "reasoning")`);
        } else notes.push(`${where}: dropped capabilities.${ck}`);
      }
    } else if (k === 'disabled') disabled = v === true;
    else if (k === 'settings' && isObj(v)) out.options = { ...(out.options || {}), ...v };
    else if (k === 'cost' && isObj(v)) {
      const { cache, ...rest } = v;
      out.cost = { ...rest };
      if (isObj(cache)) {
        if (cache.read !== undefined) out.cost.cache_read = cache.read;
        if (cache.write !== undefined) out.cost.cache_write = cache.write;
      }
    } else if (k === 'variants' && Array.isArray(v)) {
      out.variants = {};
      for (const vv of v) {
        if (!isObj(vv) || !vv.id) continue;
        out.variants[vv.id] = { ...(isObj(vv.settings) ? vv.settings : {}) };
        if (vv.body || vv.headers) notes.push(`${where}: variant "${vv.id}" body/headers dropped`);
      }
    } else if (k === 'compatibility' || k === 'body') notes.push(`${where}: dropped "${k}" (not supported by OpenCode 1.x)`);
    else out[k] = v;
  }
  return { obj: out, disabled };
}

function v2ProviderToV1(p, pid = 'provider') {
  const notes = [];
  if (!isObj(p)) return { obj: p, notes };
  const out = {};
  const options = () => (out.options ||= {});
  const disabledIds = [];
  for (const [k, v] of Object.entries(p)) {
    if (k === 'package') {
      out.npm = v === NATIVE_OAI ? '@ai-sdk/openai-compatible' : String(v).replace(/^aisdk:/, '');
      if (v !== NATIVE_OAI && !/^aisdk:/.test(v)) notes.push(`${pid}: package "${v}" has no known V1 equivalent; kept as npm`);
    } else if (k === 'settings' && isObj(v)) Object.assign(options(), v);
    else if (k === 'headers') options().headers = v;
    else if (k === 'compatibility' && isObj(v)) {
      for (const [ck, cv] of Object.entries(v)) {
        if (ck === 'supportsPromptCacheKey') options().setCacheKey = cv;
        else notes.push(`${pid}: dropped compatibility.${ck} (not supported by OpenCode 1.x)`);
      }
    } else if (k === 'body') notes.push(`${pid}: dropped "body" (not supported by OpenCode 1.x)`);
    else if (k === 'models' && isObj(v)) {
      out.models = {};
      for (const [mid, mo] of Object.entries(v)) {
        const r = v2ModelToV1(mo, notes, `${pid}/${mid}`);
        if (r.disabled) disabledIds.push(mid);
        // A built-in model entry that only said "disabled" becomes just a blacklist entry.
        if (!(r.disabled && !isCustom(p) && isObj(r.obj) && !Object.keys(r.obj).length)) out.models[mid] = r.obj;
      }
      if (!Object.keys(out.models).length) delete out.models;
    } else out[k] = v;
  }
  if (disabledIds.length) out.blacklist = disabledIds;
  return { obj: out, notes };
}

function convertProviderToV1(pid, ask = true) {
  if (fmtOf(pid) === 'v1') return;
  if (hasOwn(v1Map(), pid)) { toast(`"provider" already has an entry named ${pid}`, true); return; }
  const { obj, notes } = v2ProviderToV1(clone(prov(pid)), pid);
  const msg = `Convert "${pid}" to the OpenCode 1.x format?\n\nIt moves from "providers" to "provider"; package → npm, settings/headers → options, ` +
    `"disabled": true → blacklist.` + (notes.length ? `\n\nNotes:\n• ${notes.join('\n• ')}` : '');
  if (ask && !confirm(msg)) return;
  mutate(() => {
    delete S.config.providers[pid];
    if (!Object.keys(S.config.providers).length) delete S.config.providers;
    if (!isObj(S.config.provider)) S.config.provider = {};
    S.config.provider[pid] = obj;
    S.meta[pid] = { ...(S.meta[pid] || {}), mode: obj.blacklist ? 'blacklist' : inferMode(pid, obj) };
  });
}

function convertAll(to) {
  const ids = Object.keys(to === 'v2' ? v1Map() : v2Map()).filter(pid => !hasOwn(to === 'v2' ? v2Map() : v1Map(), pid));
  if (!ids.length) return;
  const notes = ids.flatMap(pid => (to === 'v2' ? v1ProviderToV2 : v2ProviderToV1)(clone(prov(pid)), pid).notes);
  if (!confirm(`Convert ${ids.length} provider(s) to the ${to === 'v2' ? 'OpenCode 2' : 'OpenCode 1.x'} format: ${ids.join(', ')}?` +
    (notes.length ? `\n\nNotes:\n• ${notes.join('\n• ')}` : ''))) return;
  for (const pid of ids) {
    if (to === 'v2') {
      const { obj } = v1ProviderToV2(clone(prov(pid)), pid);
      mutate(() => {
        delete S.config.provider[pid];
        if (!Object.keys(S.config.provider).length) delete S.config.provider;
        if (!isObj(S.config.providers)) S.config.providers = {};
        S.config.providers[pid] = obj;
        S.meta[pid] = { ...(S.meta[pid] || {}), mode: 'disabled' };
      });
    } else convertProviderToV1(pid, false);
  }
}

// Rename a model key, keeping order, its disable state and references to provider/model.
function renameModelKey(pid, old, nw) {
  nw = (nw || '').trim();
  if (!nw || nw === old) return false;
  if (modelState(pid).known.includes(nw) && !(meta(pid).fetched || []).includes(nw)) { toast(`Model "${nw}" already exists`, true); return false; }
  const p = prov(pid);
  if (isObj(p.models) && hasOwn(p.models, old)) {
    const out = {};
    for (const k of Object.keys(p.models)) out[k === old ? nw : k] = p.models[k];
    p.models = out;
  }
  const stash = S.stash[pid];
  if (stash && hasOwn(stash, old)) { stash[nw] = stash[old]; delete stash[old]; }
  for (const k of ['blacklist', 'whitelist']) if (Array.isArray(p[k])) p[k] = p[k].map(x => x === old ? nw : x);
  const from = `${pid}/${old}`, to = `${pid}/${nw}`;
  for (const k of ['model', 'small_model']) if (S.config[k] === from) S.config[k] = to;
  for (const sect of ['agent', 'agents', 'mode']) {
    if (isObj(S.config[sect])) for (const a of Object.values(S.config[sect])) if (isObj(a) && a.model === from) a.model = to;
  }
  return true;
}

// ---------------------------------------------------------------- OpenCode 1.x cache_control workarounds
// 1.x attaches cache_control to any model whose id contains "claude" or "anthropic" and has no
// option to turn it off (https://github.com/anomalyco/opencode/issues/6473). Two workarounds:
// a plugin that strips the markers from outgoing requests, or gateway-side model aliases.

const jsIdent = s => s.replace(/[^A-Za-z0-9_$]/g, '_');

function buildStripPlugin(pids) {
  const hooks = pids.map(pid => `export const StripCacheControl_${jsIdent(pid)} = async () => ({
  auth: {
    provider: ${JSON.stringify(pid)},
    methods: [{ type: "api", label: "API key" }],
    async loader() {
      return { fetch: stripCacheControlFetch }
    },
  },
})`).join('\n\n');
  return `// OpenCode 1.x plugin: removes Anthropic prompt-caching markers ("cache_control" / "cacheControl")
// from requests sent to: ${pids.join(', ')}.
// OpenCode 1.x adds them to every model whose id contains "claude" or "anthropic", and some
// OpenAI-compatible gateways reject them. Community workaround from
// https://github.com/anomalyco/opencode/issues/6473
//
// Install: save as ~/.config/opencode/plugin/strip-cache-control.js (all projects)
//          or .opencode/plugin/strip-cache-control.js (one project).
// The loader only runs when OpenCode has stored credentials for the provider, so once per provider run:
//   opencode auth login  ->  Other  ->  provider id  ->  API key
//
// Generated by OpenCode Config Editor.

const STRIP_KEYS = new Set(["cache_control", "cacheControl"])

function strip(value) {
  if (Array.isArray(value)) return value.map(strip)
  if (value && typeof value === "object") {
    const out = {}
    for (const [key, v] of Object.entries(value)) if (!STRIP_KEYS.has(key)) out[key] = strip(v)
    return out
  }
  return value
}

async function stripCacheControlFetch(input, init) {
  if (init && typeof init.body === "string") {
    try {
      init = { ...init, body: JSON.stringify(strip(JSON.parse(init.body))) }
    } catch {
      // not JSON: send unchanged
    }
  }
  return fetch(input, init)
}

${hooks}
`;
}

// Suggested alias: the model id without the words that trigger 1.x caching.
const suggestAlias = id => id.replace(/anthropic[/:.]?/gi, '').replace(/claude/gi, 'cld').replace(/^[-_/.]+/, '') || id + '-alias';

// Rename each model to its gateway alias; the old id becomes its display name when it has none.
function applyAliases(pid, aliases) {
  mutate(() => {
    for (const [old, alias] of Object.entries(aliases)) {
      if (!renameModelKey(pid, old, alias)) continue;
      const moved = modelObj(pid, alias.trim(), false);
      if (isObj(moved)) {
        if (moved.name === undefined) moved.name = old;
        delete moved[P(pid).modelId[0]]; // the alias is what gets sent now
      }
    }
  });
}

// ---------------------------------------------------------------- Anthropic-compatible API (OpenCode 1.x)
// Gateways that also expose Anthropic's Messages API (POST <baseURL>/messages) accept cache_control
// natively when the models are served through @ai-sdk/anthropic instead of the OpenAI-compatible SDK.

const ANTHROPIC_NPM = '@ai-sdk/anthropic';

// opts: { mode: 'split' | 'switch', newId, name, baseURL, bearer, models: [ids], original: 'remove' | 'disable' }
function applyAnthropicCompat(pid, opts) {
  mutate(() => {
    const src = prov(pid);
    const srcOpts = isObj(src.options) ? src.options : {};
    const bearerHeader = () => 'Bearer ' + (typeof srcOpts.apiKey === 'string' ? srcOpts.apiKey : '{env:API_KEY}');
    if (opts.mode === 'switch') {
      src.npm = ANTHROPIC_NPM;
      setIn(src, ['options', 'baseURL'], opts.baseURL || undefined);
      if (opts.bearer) setIn(src, ['options', 'headers', 'Authorization'], bearerHeader());
      return;
    }
    const target = { npm: ANTHROPIC_NPM, name: opts.name || opts.newId, options: {} };
    if (opts.baseURL) target.options.baseURL = opts.baseURL;
    if (srcOpts.apiKey !== undefined) target.options.apiKey = srcOpts.apiKey;
    if (isObj(srcOpts.headers)) target.options.headers = clone(srcOpts.headers);
    if (opts.bearer) (target.options.headers ||= {}).Authorization = bearerHeader();
    target.models = {};
    for (const id of opts.models) target.models[id] = clone(modelObj(pid, id, false)) ?? {};
    if (!Object.keys(target.models).length) delete target.models;

    // Insert the new provider right after the source one.
    const out = {};
    for (const k of Object.keys(S.config.provider)) {
      out[k] = S.config.provider[k];
      if (k === pid) out[opts.newId] = target;
    }
    S.config.provider = out;
    S.meta[opts.newId] = { mode: 'omit' };

    if (opts.original === 'disable') {
      const E = new Set(modelState(pid).enabled);
      opts.models.forEach(id => E.delete(id));
      applyEnabled(pid, E, meta(pid).mode);
    } else {
      for (const id of opts.models) {
        if (isObj(src.models)) delete src.models[id];
        if (S.stash[pid]) delete S.stash[pid][id];
        if (Array.isArray(src.blacklist)) src.blacklist = src.blacklist.filter(x => x !== id);
        if (Array.isArray(src.whitelist)) src.whitelist = src.whitelist.filter(x => x !== id);
      }
      if (isObj(src.models) && !Object.keys(src.models).length) delete src.models;
      if (Array.isArray(src.blacklist) && !src.blacklist.length) delete src.blacklist;
    }

    // Point references at the moved models.
    const fix = v => {
      if (typeof v !== 'string' || !v.startsWith(pid + '/')) return v;
      const mid = v.slice(pid.length + 1);
      return opts.models.includes(mid) ? `${opts.newId}/${mid}` : v;
    };
    for (const k of ['model', 'small_model']) if (hasOwn(S.config, k)) S.config[k] = fix(S.config[k]);
    for (const sect of ['agent', 'mode']) {
      if (isObj(S.config[sect])) for (const a of Object.values(S.config[sect])) if (isObj(a) && a.model) a.model = fix(a.model);
    }
    S.selected = opts.newId;
  });
}

// ---------------------------------------------------------------- prompt caching (cache_control)

const CACHE_KEYS = ['cache_control', 'cacheControl'];

// Paths of every explicit cache_control / cacheControl key inside a provider entry.
function findCacheKeys(o, path = [], out = []) {
  if (Array.isArray(o)) o.forEach((x, i) => findCacheKeys(x, [...path, i], out));
  else if (isObj(o)) for (const [k, v] of Object.entries(o)) {
    if (CACHE_KEYS.includes(k)) out.push([...path, k]);
    else findCacheKeys(v, [...path, k], out);
  }
  return out;
}

function cacheReport(pid) {
  const p = prov(pid) || {};
  const models = isObj(p.models) ? p.models : {};
  const providerFormat = p.compatibility?.cacheFormat;
  const modelFormats = Object.entries(models)
    .filter(([, mo]) => isObj(mo) && mo.compatibility?.cacheFormat)
    .map(([id, mo]) => [id, mo.compatibility.cacheFormat]);
  const st = modelState(pid);
  const claude = st.known.filter(id => isClaude(id, modelObj(pid, id, false)));
  return { providerFormat, modelFormats, explicit: findCacheKeys(p), claude, enabledClaude: claude.filter(id => st.enabled.has(id)) };
}

// Stop OpenCode from sending cache_control: unset every cacheFormat and delete explicit markers.
function stripCacheControl(pid) {
  mutate(() => {
    const p = prov(pid);
    const unsetFormat = o => { if (isObj(o?.compatibility)) setIn(o, ['compatibility', 'cacheFormat'], undefined); };
    // Delete each marker, then prune objects it left empty (but never a model entry itself).
    const strip = (root, isModel) => {
      for (const path of findCacheKeys(root).reverse()) {
        const parentOf = n => getIn(root, path.slice(0, n));
        delete parentOf(path.length - 1)[path[path.length - 1]];
        const floor = isModel ? 0 : path[0] === 'models' ? 2 : 0;
        for (let n = path.length - 1; n > floor; n--) {
          const node = parentOf(n);
          if (isObj(node) && !Object.keys(node).length) delete parentOf(n - 1)[path[n - 1]]; else break;
        }
      }
    };
    unsetFormat(p);
    for (const mo of Object.values(isObj(p.models) ? p.models : {})) unsetFormat(mo);
    for (const mo of Object.values(S.stash[pid] || {})) unsetFormat(mo);
    strip(p, false);
    for (const mo of Object.values(S.stash[pid] || {})) strip(mo, true);
  });
}

// For gateways that accept Anthropic-style markers: enable caching on Claude models only.
function setClaudeCacheFormat(pid, format) {
  mutate(() => {
    for (const id of cacheReport(pid).enabledClaude) setIn(modelObj(pid, id, true), ['compatibility', 'cacheFormat'], format);
  });
}

// ---------------------------------------------------------------- /models fetching

function defaultFetchUrl(pid) {
  const p = prov(pid) || {};
  const url = getIn(p, P(pid).baseURL) ?? (fmtOf(pid) === 'v1' ? p.api : undefined);
  const base = (typeof url === 'string' && !isSecretRef(url) && url) || KNOWN_BASE[pid];
  return base ? base.replace(/\/+$/, '') + '/models' : '';
}
function defaultAuth(pid) {
  const p = prov(pid) || {};
  if (pid === 'anthropic' || /@ai-sdk\/anthropic$/.test(pkgOf(p))) return 'anthropic';
  if (pid === 'google' || /@ai-sdk\/google$/.test(pkgOf(p))) return 'google';
  return 'bearer';
}
function fetchKey(pid) {
  if (sessionKeys[pid]) return sessionKeys[pid];
  const k = getIn(prov(pid), P(pid).apiKey);
  return typeof k === 'string' && !isSecretRef(k) ? k : '';
}

function parseModelsResponse(json) {
  const arr = Array.isArray(json) ? json
    : Array.isArray(json?.data) ? json.data
    : Array.isArray(json?.models) ? json.models
    : Array.isArray(json?.result) ? json.result : null;
  if (!arr) throw new Error('Could not find a model list (expected "data" or "models" array)');
  const out = [];
  for (const it of arr) {
    if (typeof it === 'string') { out.push({ id: it }); continue; }
    if (!isObj(it)) continue;
    const idFromName = it.id == null;
    let id = it.id ?? it.name ?? it.model;
    if (typeof id !== 'string' || !id) continue;
    id = id.replace(/^models\//, '');
    const name = it.display_name ?? it.displayName ?? (!idFromName && typeof it.name === 'string' && it.name !== id ? it.name : undefined);
    const context = it.context_length ?? it.context_window ?? it.inputTokenLimit ?? it.max_context_length
      ?? it.max_model_len ?? it.top_provider?.context_length ?? it.max_input_tokens;
    const output = it.top_provider?.max_completion_tokens ?? it.outputTokenLimit ?? it.max_output_tokens ?? it.max_completion_tokens;
    out.push({
      id, name,
      context: typeof context === 'number' ? context : undefined,
      output: typeof output === 'number' ? output : undefined,
      inMods: normModalities(it.architecture?.input_modalities ?? it.modalities?.input ?? it.input_modalities),
      outMods: normModalities(it.architecture?.output_modalities ?? it.modalities?.output ?? it.output_modalities),
    });
  }
  return out;
}

// Modality lists from /models responses (OpenRouter "file" means document input), known values only.
function normModalities(list) {
  if (!Array.isArray(list)) return undefined;
  const out = uniq(list.map(x => String(x).toLowerCase()).map(x => x === 'file' ? 'pdf' : x).filter(x => MODALITIES.includes(x)));
  return out.length ? sortModalities(out) : undefined;
}

function fillMeta(obj, it, fmt = 'v1') {
  if (it.name && obj.name === undefined) obj.name = it.name;
  if (it.context && it.output && obj.limit === undefined) obj.limit = { context: it.context, output: it.output };
  const paths = MOD_PATHS[fmt];
  if ((it.inMods || it.outMods) && getIn(obj, paths.input) === undefined && getIn(obj, paths.output) === undefined) {
    const def = modalityDefaults(fmt);
    if (fmt === 'v1') {
      // V1 needs both lists together.
      setIn(obj, paths.input, it.inMods || def.input);
      setIn(obj, paths.output, it.outMods || def.output);
    } else {
      if (it.inMods) setIn(obj, paths.input, it.inMods);
      if (it.outMods) setIn(obj, paths.output, it.outMods);
    }
  }
  return obj;
}

// Escape text for use inside a double-quoted shell string.
const dqEscape = s => String(s).replace(/[\\"`$]/g, '\\$&');

// Convert a config string to shell syntax: {env:VAR} -> ${VAR}, {file:path} -> $(cat path), rest escaped.
function toShell(v) {
  let out = '', last = 0;
  for (const m of String(v).matchAll(/\{(env|file):([^}]+)\}/g)) {
    out += dqEscape(v.slice(last, m.index));
    out += m[1] === 'env' ? '${' + m[2].trim() + '}' : '$(cat ' + m[2].trim() + ')';
    last = m.index + m[0].length;
  }
  return out + dqEscape(v.slice(last));
}

// Everything needed to call the models endpoint. Header values come in two forms:
// `real` (usable by fetch(), null if it depends on an env/file reference) and `shell` (for curl).
// The fetch-time API key and its shell form for curl ({env:X} -> ${X}; otherwise ${API_KEY}).
function keyInfo(pid) {
  const cfgKey = getIn(prov(pid), P(pid).apiKey);
  return {
    realKey: fetchKey(pid),
    shellKey: !sessionKeys[pid] && isSecretRef(cfgKey) ? toShell(cfgKey) : '${API_KEY}',
  };
}

// The provider's own headers. Values that reference {env:}/{file:} can't be sent from the browser.
function providerHeaders(pid) {
  const extra = getIn(prov(pid), P(pid).headers);
  const out = [];
  if (isObj(extra)) for (const [k, v] of Object.entries(extra)) {
    if (typeof v === 'string') out.push({ name: k, real: isSecretRef(v) ? null : v, shell: toShell(v) });
  }
  return out;
}

function proxied(url) {
  const proxy = S.settings.corsProxy.trim();
  return !proxy ? url : proxy.includes('{url}') ? proxy.replace('{url}', encodeURIComponent(url)) : proxy + url;
}

// Everything needed to call the models endpoint. Header values come in two forms:
// `real` (usable by fetch(), null if it depends on an env/file reference) and `shell` (for curl).
function buildRequest(pid) {
  const m = meta(pid);
  const url = m.fetchUrl || defaultFetchUrl(pid);
  if (!url) throw new Error('No URL. Set the provider base URL or a fetch URL.');
  const auth = m.auth || defaultAuth(pid);
  const { realKey, shellKey } = keyInfo(pid);
  const headers = [{ name: 'Accept', real: 'application/json', shell: 'application/json' }, ...providerHeaders(pid)];
  if (auth === 'anthropic') {
    headers.push({ name: 'anthropic-version', real: '2023-06-01', shell: '2023-06-01' });
    headers.push({ name: 'anthropic-dangerous-direct-browser-access', real: 'true', shell: 'true', browserOnly: true });
  }
  if (auth === 'bearer') headers.push({ name: 'Authorization', real: realKey ? 'Bearer ' + realKey : null, shell: 'Bearer ' + shellKey, key: true });
  if (auth === 'anthropic') headers.push({ name: 'x-api-key', real: realKey || null, shell: shellKey, key: true });
  let u;
  try { u = new URL(url); } catch { throw new Error(`Invalid URL: ${url}`); }
  if (auth === 'anthropic' && !u.searchParams.has('limit')) u.searchParams.set('limit', '1000');
  if (auth === 'google' && !u.searchParams.has('pageSize')) u.searchParams.set('pageSize', '1000');
  return { url: u, auth, headers, realKey, shellKey };
}

// Render a request spec { url, headers, body?, keyInQuery?, needsKey, realKey, shellKey } as curl.
// Unless includeKey is set, the key is referenced via an env var instead of being inlined.
function renderCurl(spec, includeKey) {
  const inline = includeKey && !!spec.realKey;
  const keyShell = inline ? dqEscape(spec.realKey) : spec.shellKey;
  let url = dqEscape(spec.url);
  if (spec.keyInQuery) url += (spec.url.includes('?') ? '&' : '?') + 'key=' + keyShell;
  const lines = [`curl -sS "${url}"`];
  for (const h of spec.headers) {
    if (h.browserOnly) continue;
    const val = h.key ? h.shell.replace(spec.shellKey, () => keyShell) : h.shell;
    lines.push(`-H "${dqEscape(h.name)}: ${val}"`);
  }
  if (spec.body !== undefined) lines.push(`--data-raw '${JSON.stringify(spec.body).replace(/'/g, `'\\''`)}'`);
  let cmd = lines.join(' \\\n  ');
  if (spec.needsKey && !inline && spec.shellKey === '${API_KEY}') cmd = `# First run: export API_KEY='your-key'\n` + cmd;
  return cmd;
}

// A curl command equivalent to the browser request (curl isn't subject to CORS).
function buildCurl(pid, includeKey = false) {
  const r = buildRequest(pid);
  return renderCurl({ ...r, url: r.url.href, keyInQuery: r.auth === 'google', needsKey: r.auth !== 'none' }, includeKey);
}

// ---------------------------------------------------------------- Anthropic Messages API test requests

const TEST_SYSTEM = 'You are a connectivity test. Reply with the single word OK.';

// The id sent to the API for a model: its id/modelID override, else the config key.
const apiModelId = (pid, id) => getIn(modelObj(pid, id, false), P(pid).modelId) || id;

// A minimal POST <baseURL>/messages, optionally with a cache_control marker on the system prompt so
// the test also shows whether the endpoint accepts the markers OpenCode sends.
function anthropicTestRequest(pid, { baseURL, bearer, model, cache }) {
  const { realKey, shellKey } = keyInfo(pid);
  const base = (baseURL || 'https://api.anthropic.com/v1').replace(/\/+$/, '');
  const own = providerHeaders(pid).filter(h => !(bearer && h.name.toLowerCase() === 'authorization'));
  const headers = [
    { name: 'Content-Type', real: 'application/json', shell: 'application/json' },
    { name: 'anthropic-version', real: '2023-06-01', shell: '2023-06-01' },
    ...own,
    { name: 'anthropic-dangerous-direct-browser-access', real: 'true', shell: 'true', browserOnly: true },
    { name: 'x-api-key', real: realKey || null, shell: shellKey, key: true },
  ];
  if (bearer) headers.push({ name: 'Authorization', real: realKey ? 'Bearer ' + realKey : null, shell: 'Bearer ' + shellKey, key: true });
  const body = {
    model,
    max_tokens: 32,
    system: cache ? [{ type: 'text', text: TEST_SYSTEM, cache_control: { type: 'ephemeral' } }] : TEST_SYSTEM,
    messages: [{ role: 'user', content: 'Reply with OK.' }],
  };
  return { url: base + '/messages', headers, body, realKey, shellKey, needsKey: true };
}

async function runTestRequest(spec) {
  const missing = spec.headers.filter(h => h.real == null && !h.browserOnly);
  if (missing.some(h => h.key)) return { ok: false, message: 'No API key available in the browser. Enter one below (kept in memory only), or use the curl command.' };
  if (missing.length) return { ok: false, message: `Header(s) ${missing.map(h => h.name).join(', ')} use {env:}/{file:} references, which the browser can't resolve. Use the curl command.` };
  const headers = {};
  for (const h of spec.headers) headers[h.name] = h.real;
  const t0 = performance.now();
  let res;
  try { res = await fetch(proxied(spec.url), { method: 'POST', headers, body: JSON.stringify(spec.body) }); }
  catch (e) {
    return { ok: false, cors: true, message: `Request failed (${e.message}). Usually CORS: the gateway doesn't allow browser requests. Run the curl command instead.` };
  }
  const ms = Math.round(performance.now() - t0);
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch { /* not JSON */ }
  if (!res.ok) return { ok: false, status: res.status, ms, message: json?.error?.message || json?.message || text.slice(0, 300) };
  if (!json || !Array.isArray(json.content)) return { ok: false, status: res.status, ms, message: 'Not an Anthropic Messages response: ' + text.slice(0, 200) };
  const reply = json.content.filter(c => c.type === 'text').map(c => c.text).join('').trim();
  return { ok: true, status: res.status, ms, reply, model: json.model, usage: json.usage };
}

async function fetchModels(pid) {
  const r = buildRequest(pid);
  const key = r.realKey, auth = r.auth;
  const headers = {};
  for (const h of r.headers) if (h.real != null) headers[h.name] = h.real;
  const items = [];
  let page = r.url;
  for (let i = 0; i < 20 && page; i++) {
    const u = new URL(page);
    if (auth === 'google' && key) u.searchParams.set('key', key);
    let res;
    try { res = await fetch(proxied(u.href), { headers }); }
    catch (e) {
      throw new Error(`Request failed (${e.message}). This is usually CORS: the server does not allow browser requests. ` +
        `Use "curl / paste response…" to run the request in a terminal and paste the result, or configure a CORS proxy in General settings.`);
    }
    const body = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}: ${body.slice(0, 300)}`);
    let json;
    try { json = JSON.parse(body); } catch { throw new Error('Response is not JSON: ' + body.slice(0, 200)); }
    items.push(...parseModelsResponse(json));
    page = null;
    if (json.has_more && json.last_id) { page = new URL(u); page.searchParams.set('after_id', json.last_id); }
    else if (json.nextPageToken) { page = new URL(u); page.searchParams.set('pageToken', json.nextPageToken); }
    if (page) page.searchParams.delete('key');
  }
  return items;
}

function mergeFetched(pid, items, { enableNew, addMeta }) {
  const seen = new Set();
  items = items.filter(it => !seen.has(it.id) && seen.add(it.id));
  let newCount = 0;
  mutate(() => {
    const st = modelState(pid), m = meta(pid);
    const stash = S.stash[pid] ||= {};
    const known = new Set(st.known);
    const newIds = [];
    for (const it of items) {
      if (!known.has(it.id)) {
        newIds.push(it.id);
        stash[it.id] = addMeta ? fillMeta({}, it, fmtOf(pid)) : {};
      } else if (addMeta) {
        const obj = modelObj(pid, it.id, false);
        if (isObj(obj)) fillMeta(obj, it, fmtOf(pid));
        else if (!hasOwn(st.models, it.id)) {
          const filled = fillMeta({}, it, fmtOf(pid));
          if (Object.keys(filled).length) stash[it.id] = filled;
        }
      }
    }
    m.fetched = items.map(i => i.id);
    m.fetchedAt = Date.now();
    m.newIds = newIds;
    newCount = newIds.length;
    const E = new Set(modelState(pid).enabled);
    if (enableNew) newIds.forEach(id => E.add(id));
    applyEnabled(pid, E, m.mode);
  });
  return newCount;
}

// ---------------------------------------------------------------- output generation

function diff(a, b, path, out) {
  if (isObj(a) && isObj(b)) {
    const sub = [];
    for (const k of Object.keys(a)) if (!hasOwn(b, k)) sub.push({ path: [...path, k], value: undefined, kind: 'removed' });
    for (const k of Object.keys(b)) {
      if (!hasOwn(a, k)) sub.push({ path: [...path, k], value: b[k], kind: 'added' });
      else diff(a[k], b[k], [...path, k], sub);
    }
    // Many edits inside one object: replace it wholesale (much faster than hundreds of text edits).
    if (sub.length > 60 && path.length > 0) out.push({ path, value: b, kind: 'changed' });
    else out.push(...sub);
  } else if (!deepEqual(a, b)) out.push({ path, value: b, kind: 'changed' });
}

function detectFormatting(text) {
  const m = text.match(/\n([ \t]+)["}\]]/);
  const eol = text.includes('\r\n') ? '\r\n' : '\n';
  if (m && m[1][0] === '\t') return { insertSpaces: false, tabSize: 1, eol };
  return { insertSpaces: true, tabSize: m ? m[1].length : 2, eol };
}

function generateOutput() {
  if (S.origText == null) return { text: JSON.stringify(S.config, null, 2) + '\n', changes: null };
  const changes = [];
  diff(S.origConfig, S.config, [], changes);
  let text = S.origText;
  try {
    const formattingOptions = detectFormatting(text);
    for (const c of changes) text = jsonc.applyEdits(text, jsonc.modify(text, c.path, c.value, { formattingOptions }));
  } catch (e) {
    console.error('Edit application failed, falling back to full serialization', e);
    text = JSON.stringify(S.config, null, 2) + '\n';
  }
  return { text, changes };
}

function computeWarnings() {
  const w = [];
  for (const [pid, p] of Object.entries(providers())) {
    if (!isObj(p)) continue;
    const fmt = fmtOf(pid);
    if (/openai-compatible$/.test(pkgOf(p)) && !getIn(p, P(pid).baseURL)) w.push(`${pid}: openai-compatible provider has no ${P(pid).baseURL.join('.')}`);
    if (hasOwn(v1Map(), pid) && hasOwn(v2Map(), pid)) w.push(`${pid}: defined in both "provider" and "providers"; the "providers" entry wins`);
    const foreign = fmt === 'v2' ? ['npm', 'options', 'whitelist', 'blacklist', 'api'] : ['package', 'settings', 'compatibility', 'body'];
    const mixed = foreign.filter(k => hasOwn(p, k));
    if (mixed.length) w.push(`${pid}: ${fmt === 'v2' ? 'V1' : 'V2'} keys (${mixed.join(', ')}) in a ${fmt === 'v2' ? '"providers" (V2)' : '"provider" (V1)'} entry; OpenCode doesn't support mixing formats inside one provider`);
    const target = targetVersion();
    if (target === 'v1' && fmt === 'v2') w.push(`${pid}: "providers" entries are OpenCode 2 only; 1.x won't load it — use "Convert to V1"`);
    if (target === 'v2' && fmt === 'v1' && (Array.isArray(p.whitelist) || Array.isArray(p.blacklist)))
      w.push(`${pid}: OpenCode 2 ignores whitelist/blacklist, so disabled models will show up — use "Convert to V2"`);
    if (target === 'v1' && fmt === 'v1' && /openai-compatible$/.test(pkgOf(p))) {
      const n = cacheReport(pid).enabledClaude.length;
      if (n) w.push(`${pid}: OpenCode 1.x adds cache_control for ${n} Claude model(s); if the gateway rejects it, see the provider's prompt caching section`);
    }
    if (fmt === 'v2') {
      const rep = cacheReport(pid);
      if (rep.claude.length && (rep.providerFormat || rep.modelFormats.length || rep.explicit.length) && /openai-compatible$/.test(pkgOf(p)))
        w.push(`${pid}: sends cache_control markers; if the gateway rejects them, use "Remove all cache markers" in the provider's prompt caching section`);
    }
    if (isObj(p.models)) for (const [mid, mo] of Object.entries(p.models)) {
      if (isObj(mo?.limit) && (typeof mo.limit.context !== 'number' || typeof mo.limit.output !== 'number'))
        w.push(`${pid}/${mid}: "limit" needs both context and output`);
    }
  }
  for (const [k, v] of modelRefs()) {
    if (typeof v !== 'string' || !v) continue;
    const i = v.indexOf('/');
    if (i < 0) { w.push(`${k}: should be "provider/model"`); continue; }
    const pid = v.slice(0, i), mid = v.slice(i + 1);
    if (prov(pid)) {
      const st = modelState(pid);
      if (st.known.includes(mid) && !st.enabled.has(mid)) w.push(`${k}: points to disabled model ${v}`);
    }
    const why = providerBlocked(pid);
    if (why) w.push(`${k}: provider "${pid}" is ${why}`);
  }
  return w;
}

// Every [label, "provider/model"] reference: model, small_model and per-agent models.
function modelRefs() {
  const refs = [['model', S.config.model], ['small_model', S.config.small_model]];
  for (const sect of ['agent', 'agents', 'mode']) {
    if (isObj(S.config[sect])) for (const [name, a] of Object.entries(S.config[sect])) {
      if (isObj(a) && a.model !== undefined) refs.push([`${sect}.${name}.model`, a.model]);
    }
  }
  return refs;
}

// Why a provider won't load (disabled_providers, or left out of enabled_providers), or null.
function providerBlocked(pid) {
  if ((S.config.disabled_providers || []).includes(pid)) return 'disabled (disabled_providers)';
  if (Array.isArray(S.config.enabled_providers) && !S.config.enabled_providers.includes(pid)) return 'not in enabled_providers';
  return null;
}

// ---------------------------------------------------------------- import / export

function importText(text, fileName) {
  const cfg = parseJsonc(text);
  if (!isObj(cfg)) throw new Error('The config root must be a JSON object');
  S.origText = text;
  S.origConfig = cfg;
  S.config = clone(cfg);
  S.fileName = fileName || 'opencode.json';
  S.stash = {}; S.meta = {};
  S.selected = Object.keys(providers())[0] || '__general';
  history.length = 0; future.length = 0; lastKey = null;
  persist(); bump();
  toast(`Imported ${S.fileName}`);
}

async function importFile(file) {
  try { importText(await file.text(), file.name); }
  catch (e) { toast(`Import failed: ${e.message}`, true); }
}

function newConfig() {
  if (!confirm('Start a new empty config? Unsaved changes will be lost (undo history is cleared).')) return;
  S.origText = null; S.origConfig = null; S.config = { $schema: SCHEMA_URL };
  S.fileName = 'opencode.json'; S.stash = {}; S.meta = {}; S.selected = '__general';
  history.length = 0; future.length = 0;
  persist(); bump();
}

function download(text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = S.fileName || 'opencode.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------------------------------------------------------- local mode
// GET {api}/config returns the file text on disk ("text", empty when it does not exist) and
// the config the setup script plans to write ("planned"). The file text becomes the imported
// original, so the output keeps its comments and formatting and only the edits are applied.
async function localBoot() {
  const res = await fetch(LOCAL.api + '/config');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const d = await res.json();
  if (d.text && d.text.trim()) {
    S.origText = d.text;
    S.origConfig = parseJsonc(d.text);
    if (!isObj(S.origConfig)) S.origConfig = {};
  }
  S.config = clone(isObj(d.planned) ? d.planned : S.origConfig || {});
  S.fileName = d.path;
  S.stash = {};
  S.meta = {};
  const pid = LOCAL.providerId;
  if (pid && hasOwn(providers(), pid)) {
    // List every model the host knows so ones left out of the planned config can be enabled.
    // gatewayModels is the older name of models.
    S.meta[pid] = { mode: 'omit', auth: LOCAL.auth || 'bearer', fetched: d.models || d.gatewayModels || [] };
    S.selected = pid;
  }
  // Requests go through the host, which can add credentials it holds.
  S.settings = { ...S.settings, corsProxy: LOCAL.api + '/proxy?url={url}' };
  // The installed OpenCode's major version, when the host could detect it.
  if (LOCAL.target === 'v1' || LOCAL.target === 'v2') S.settings.target = LOCAL.target;
}

async function localFinish(action, text) {
  try {
    const res = await fetch(LOCAL.api + '/' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text || '' }),
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || 'HTTP ' + res.status);
    // Opened from the web setup: go back to it.
    if (LOCAL.returnUrl) { location.href = LOCAL.returnUrl; return; }
    setUI({ localDone: action === 'save' ? 'Saved. Return to the terminal to review and apply the changes.' : 'Cancelled. Return to the terminal.' });
  } catch (e) {
    toast(`${action === 'save' ? 'Save' : 'Cancel'} failed: ${e.message}`, true);
  }
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
  catch { toast('Clipboard not available', true); }
}

// Input that only commits on blur / Enter (used for renames and adding items).
function CommitInput({ value = '', onCommit, placeholder, mono, clearOnCommit }) {
  const [text, setText] = useState(value);
  useEffect(() => setText(value), [value]);
  const commit = () => { if (text !== value) onCommit(text); if (clearOnCommit) setText(''); };
  return html`<input type="text" class=${mono ? 'mono' : ''} value=${text} placeholder=${placeholder || ''} spellcheck="false"
    onInput=${e => setText(e.target.value)} onBlur=${() => !clearOnCommit && commit()}
    onKeyDown=${e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setText(value); }} />`;
}

function JsonEditor({ value, onApply, rows = 8, requireObject }) {
  const str = value === undefined ? '' : JSON.stringify(value, null, 2);
  const [text, setText] = useState(str);
  const [dirty, setDirty] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(() => { if (!dirty) setText(str); }, [str]);
  const apply = () => {
    try {
      const t = text.trim();
      const v = t === '' ? undefined : parseJsonc(t);
      if (requireObject && v !== undefined && !isObj(v)) throw new Error('Value must be a JSON object');
      onApply(v); setDirty(false); setErr(null);
    } catch (e) { setErr(e.message); }
  };
  return html`<div class="json-editor">
    <textarea rows=${rows} value=${text} spellcheck="false"
      onInput=${e => { setText(e.target.value); setDirty(true); setErr(null); }}
      onKeyDown=${e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) apply(); }} />
    <div class="row">${err ? html`<span class="err">${err}</span>` : dirty && html`<span class="muted">Unapplied changes (Ctrl+Enter to apply)</span>`}
      <span class="grow" />
      <button class="small" disabled=${!dirty} onClick=${() => { setText(str); setDirty(false); setErr(null); }}>Revert</button>
      <button class="small primary" disabled=${!dirty} onClick=${apply}>Apply</button></div></div>`;
}
